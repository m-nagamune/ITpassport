<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2f4f4a">
<title>ITパスポート 学習ノート</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232f4f4a'/%3E%3Cpath d='M8 9h7l2 2h7v13H8z' fill='%23f6f2e7'/%3E%3Cpath d='M11 14h10M11 18h7' stroke='%232f4f4a' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="description" content="ITパスポート試験の学習アプリ。4択演習・分野別分析・学習ロードマップ・用語カードを1つのHTMLファイルで。">
<style>
/* ============================================================
   ITパスポート 学習ノート — 文具・ノート風デザイン
   外部依存なし / オフライン動作
   ============================================================ */
:root{
  --paper:#f6f2e7;
  --paper-2:#fffdf7;
  --paper-3:#efe9da;
  --ink:#2c2a26;
  --ink-soft:#6d665b;
  --ink-faint:#9c9384;
  --rule:#c9d6e2;
  --margin-line:#e3a8a2;
  --cover:#2f4f4a;
  --cover-2:#223836;
  --accent:#2f6f6b;
  --accent-soft:#e3efec;
  --vermilion:#b5532f;
  --vermilion-soft:#f8e6dc;
  --highlight:#ffe98a;
  --highlight-2:#d9ecb4;
  --border:#ded5c2;
  --shadow:0 1px 2px rgba(70,60,40,.08),0 6px 16px -8px rgba(70,60,40,.28);
  --shadow-lift:0 2px 4px rgba(70,60,40,.10),0 14px 30px -12px rgba(70,60,40,.34);
  --c-strategy:#7b5ea7;
  --c-strategy-bg:#ece6f6;
  --c-management:#2f7f8f;
  --c-management-bg:#e0f0f2;
  --c-technology:#a9682b;
  --c-technology-bg:#f7e9d8;
  --radius:14px;
  --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic","Noto Sans JP","Meiryo",system-ui,-apple-system,sans-serif;
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Times New Roman",serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:var(--sans);
  color:var(--ink);
  background-color:var(--paper);
  background-image:radial-gradient(rgba(44,42,38,.055) 1px,transparent 1px);
  background-size:22px 22px;
  line-height:1.75;
  font-size:15px;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;line-height:1.4;margin:0;letter-spacing:.02em}
p{margin:0 0 .75em}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--highlight)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- レイアウト ---------- */
.app-shell{display:flex;min-height:100vh;min-height:100dvh;align-items:stretch}
.spine{
  width:236px;flex:0 0 236px;position:sticky;top:0;height:100vh;height:100dvh;
  background:linear-gradient(168deg,var(--cover) 0%,var(--cover-2) 100%);
  color:#efe9db;display:flex;flex-direction:column;
  padding:26px 18px 18px 30px;overflow-y:auto;z-index:40;
  box-shadow:inset -12px 0 22px -14px rgba(0,0,0,.6),4px 0 18px -12px rgba(0,0,0,.5);
}
.spine::before{
  content:"";position:absolute;left:8px;top:0;bottom:0;width:16px;
  background-image:radial-gradient(circle at 50% 50%,rgba(0,0,0,.55) 4.5px,transparent 5px),
                   linear-gradient(90deg,rgba(255,255,255,.16),rgba(255,255,255,0) 65%);
  background-size:16px 30px,100% 100%;
  background-repeat:repeat-y,no-repeat;
  opacity:.55;pointer-events:none;
}
.brand{display:block;color:#fff;text-decoration:none;margin:2px 0 22px}
.brand .b-main{font-family:var(--serif);font-size:20px;letter-spacing:.06em;display:block}
.brand .b-sub{display:block;font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:#b8cfc8;margin-top:4px}
.brand .b-rule{display:block;height:1px;background:linear-gradient(90deg,#8fae a6,rgba(255,255,255,.06));margin-top:10px;background-color:rgba(255,255,255,.25)}
.nav-group-label{font-size:10px;letter-spacing:.2em;color:#8fb0a9;margin:16px 0 6px 10px;text-transform:uppercase}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:9px 12px;border-radius:9px;color:#dfe9e4;text-decoration:none;font-size:13.5px;
  transition:background .16s,color .16s,transform .16s;border-left:3px solid transparent;
}
.nav-item:hover{background:rgba(255,255,255,.09);color:#fff}
.nav-item.active{background:rgba(255,255,255,.14);color:#fff;border-left-color:var(--highlight);font-weight:700}
.nav-item svg{width:17px;height:17px;flex:0 0 17px;opacity:.9}
.nav-item.active svg{opacity:1}
.nav-badge{margin-left:auto;background:var(--highlight);color:#3a3116;font-size:10.5px;font-weight:700;border-radius:20px;padding:0 7px;line-height:17px;min-width:18px;text-align:center}
.spine-foot{margin-top:auto;padding-top:18px;font-size:11px;color:#93b1aa;line-height:1.6}
.spine-foot .count-num{font-family:var(--serif);font-size:26px;color:#fff;line-height:1.1;display:block}
.spine-foot .count-label{font-size:10.5px;letter-spacing:.12em}

.main-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:none;position:sticky;top:0;z-index:30;
  background:rgba(246,242,231,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);padding:10px 14px;
  align-items:center;gap:10px;
}
.topbar .tb-title{font-family:var(--serif);font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .tb-days{font-size:11px;color:var(--ink-soft);background:var(--paper-3);border:1px solid var(--border);border-radius:20px;padding:2px 9px;white-space:nowrap}
main#view{padding:30px 34px 80px;max-width:1080px;width:100%;margin:0 auto}
.tabbar{display:none}

@media (max-width:900px){
  .spine{
    position:fixed;left:0;top:0;bottom:0;height:100dvh;width:262px;flex-basis:262px;
    transform:translateX(-104%);transition:transform .28s cubic-bezier(.3,.7,.3,1);
    box-shadow:8px 0 40px rgba(0,0,0,.4);
  }
  .spine.open{transform:translateX(0)}
  .topbar{display:flex}
  main#view{padding:16px 14px 96px}
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:35;
    background:rgba(255,253,247,.97);backdrop-filter:blur(10px);
    border-top:1px solid var(--border);padding:5px 4px calc(5px + env(safe-area-inset-bottom));
  }
  .tabbar button{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
    font-size:10px;color:var(--ink-faint);padding:4px 0;border-radius:8px;
  }
  .tabbar button.active{color:var(--accent);font-weight:700}
  .tabbar svg{width:20px;height:20px}
  .scrim{position:fixed;inset:0;background:rgba(20,26,24,.42);z-index:39;opacity:0;pointer-events:none;transition:opacity .25s}
  .scrim.show{opacity:1;pointer-events:auto}
}
@media (min-width:901px){ .scrim{display:none} .menu-btn{display:none!important} }

/* ---------- 見出し・紙片 ---------- */
.page-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-size:26px;display:flex;align-items:center;gap:10px}
.page-head .sub{color:var(--ink-soft);font-size:12.5px;letter-spacing:.02em;padding-bottom:5px}
.page-head .spacer{flex:1}
.eyebrow{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:2px}
.hl{background:linear-gradient(transparent 58%,var(--highlight) 58%,var(--highlight) 92%,transparent 92%);padding:0 2px}
.card{
  position:relative;background:var(--paper-2);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);
}
.card.tight{padding:14px 16px}
.card + .card{margin-top:16px}
.card-title{font-family:var(--serif);font-size:16.5px;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-title .ct-sub{font-family:var(--sans);font-size:11.5px;color:var(--ink-faint);font-weight:400}
.tape{
  position:absolute;width:76px;height:22px;background:rgba(214,198,150,.42);
  border-left:1px dashed rgba(255,255,255,.5);border-right:1px dashed rgba(255,255,255,.5);
  top:-10px;left:26px;transform:rotate(-2.4deg);pointer-events:none;
  box-shadow:0 1px 3px rgba(90,80,50,.12);
}
.tape.right{left:auto;right:26px;transform:rotate(2deg);background:rgba(180,200,190,.45)}
.card-lined{
  background-image:linear-gradient(transparent calc(1.75em - 1px),rgba(201,214,226,.55) 1px);
  background-size:100% 1.75em;background-position:0 .55em;
}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
@media (max-width:760px){ .grid-2,.grid-3{grid-template-columns:1fr} }

/* ---------- ボタン ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 18px;border-radius:10px;font-size:13.5px;font-weight:700;
  background:var(--paper-3);border:1px solid var(--border);color:var(--ink);
  transition:transform .12s,box-shadow .16s,background .16s;text-decoration:none;
  white-space:nowrap;
}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--accent);border-color:#285f5b;color:#fff;box-shadow:0 2px 0 #244e4a}
.btn-primary:hover{background:#356f6b}
.btn-vermilion{background:var(--vermilion);border-color:#95411f;color:#fff;box-shadow:0 2px 0 #7d3a1c}
.btn-ghost{background:transparent}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn-lg{padding:14px 26px;font-size:15.5px;border-radius:12px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row.end{justify-content:flex-end}

/* ---------- タグ・ピル ---------- */
.pill{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
  padding:2px 9px;border-radius:20px;background:var(--paper-3);color:var(--ink-soft);
  border:1px solid var(--border);white-space:nowrap;line-height:1.7;
}
.pill.strategy{background:var(--c-strategy-bg);color:#5b4382;border-color:#d9cdec}
.pill.management{background:var(--c-management-bg);color:#1f5c68;border-color:#c3dfe3}
.pill.technology{background:var(--c-technology-bg);color:#8a521f;border-color:#ebd5ba}
.pill.past{background:#fdf0d0;color:#8a6a12;border-color:#edddaa}
.pill.ok{background:#e4f2e4;color:#2f6b3a;border-color:#c6e2c6}
.pill.ng{background:var(--vermilion-soft);color:#9c4526;border-color:#f0cdbb}
.pill.unk{background:#ecebe5;color:#5b564c;border-color:#d6d1c4}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px}
.dot.strategy{background:var(--c-strategy)}
.dot.management{background:var(--c-management)}
.dot.technology{background:var(--c-technology)}
