<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2f4f4a">
<title>ITパスポート 学習ノート</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232f4f4a'/%3E%3Cpath d='M8 9h7l2 2h7v13H8z' fill='%23f6f2e7'/%3E%3Cpath d='M11 14h10M11 18h7' stroke='%232f4f4a' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="description" content="ITパスポート試験の学習アプリ。4択演習・分野別分析・学習ロードマップ・用語カードを1つのHTMLファイルで。">
<style>
/* ============================================================
   ITパスポート 学習ノート — 文具・ノート風デザイン
   外部依存なし / オフライン動作
   ============================================================ */
:root{
  --paper:#f6f2e7;
  --paper-2:#fffdf7;
  --paper-3:#efe9da;
  --ink:#2c2a26;
  --ink-soft:#6d665b;
  --ink-faint:#9c9384;
  --rule:#c9d6e2;
  --margin-line:#e3a8a2;
  --cover:#2f4f4a;
  --cover-2:#223836;
  --accent:#2f6f6b;
  --accent-soft:#e3efec;
  --vermilion:#b5532f;
  --vermilion-soft:#f8e6dc;
  --highlight:#ffe98a;
  --highlight-2:#d9ecb4;
  --border:#ded5c2;
  --shadow:0 1px 2px rgba(70,60,40,.08),0 6px 16px -8px rgba(70,60,40,.28);
  --shadow-lift:0 2px 4px rgba(70,60,40,.10),0 14px 30px -12px rgba(70,60,40,.34);
  --c-strategy:#7b5ea7;
  --c-strategy-bg:#ece6f6;
  --c-management:#2f7f8f;
  --c-management-bg:#e0f0f2;
  --c-technology:#a9682b;
  --c-technology-bg:#f7e9d8;
  --radius:14px;
  --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic","Noto Sans JP","Meiryo",system-ui,-apple-system,sans-serif;
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Times New Roman",serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:var(--sans);
  color:var(--ink);
  background-color:var(--paper);
  background-image:radial-gradient(rgba(44,42,38,.055) 1px,transparent 1px);
  background-size:22px 22px;
  line-height:1.75;
  font-size:15px;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;line-height:1.4;margin:0;letter-spacing:.02em}
p{margin:0 0 .75em}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--highlight)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- レイアウト ---------- */
.app-shell{display:flex;min-height:100vh;min-height:100dvh;align-items:stretch}
.spine{
  width:236px;flex:0 0 236px;position:sticky;top:0;height:100vh;height:100dvh;
  background:linear-gradient(168deg,var(--cover) 0%,var(--cover-2) 100%);
  color:#efe9db;display:flex;flex-direction:column;
  padding:26px 18px 18px 30px;overflow-y:auto;z-index:40;
  box-shadow:inset -12px 0 22px -14px rgba(0,0,0,.6),4px 0 18px -12px rgba(0,0,0,.5);
}
.spine::before{
  content:"";position:absolute;left:8px;top:0;bottom:0;width:16px;
  background-image:radial-gradient(circle at 50% 50%,rgba(0,0,0,.55) 4.5px,transparent 5px),
                   linear-gradient(90deg,rgba(255,255,255,.16),rgba(255,255,255,0) 65%);
  background-size:16px 30px,100% 100%;
  background-repeat:repeat-y,no-repeat;
  opacity:.55;pointer-events:none;
}
.brand{display:block;color:#fff;text-decoration:none;margin:2px 0 22px}
.brand .b-main{font-family:var(--serif);font-size:20px;letter-spacing:.06em;display:block}
.brand .b-sub{display:block;font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:#b8cfc8;margin-top:4px}
.brand .b-rule{display:block;height:1px;background:linear-gradient(90deg,#8fae a6,rgba(255,255,255,.06));margin-top:10px;background-color:rgba(255,255,255,.25)}
.nav-group-label{font-size:10px;letter-spacing:.2em;color:#8fb0a9;margin:16px 0 6px 10px;text-transform:uppercase}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:9px 12px;border-radius:9px;color:#dfe9e4;text-decoration:none;font-size:13.5px;
  transition:background .16s,color .16s,transform .16s;border-left:3px solid transparent;
}
.nav-item:hover{background:rgba(255,255,255,.09);color:#fff}
.nav-item.active{background:rgba(255,255,255,.14);color:#fff;border-left-color:var(--highlight);font-weight:700}
.nav-item svg{width:17px;height:17px;flex:0 0 17px;opacity:.9}
.nav-item.active svg{opacity:1}
.nav-badge{margin-left:auto;background:var(--highlight);color:#3a3116;font-size:10.5px;font-weight:700;border-radius:20px;padding:0 7px;line-height:17px;min-width:18px;text-align:center}
.spine-foot{margin-top:auto;padding-top:18px;font-size:11px;color:#93b1aa;line-height:1.6}
.spine-foot .count-num{font-family:var(--serif);font-size:26px;color:#fff;line-height:1.1;display:block}
.spine-foot .count-label{font-size:10.5px;letter-spacing:.12em}

.main-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:none;position:sticky;top:0;z-index:30;
  background:rgba(246,242,231,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);padding:10px 14px;
  align-items:center;gap:10px;
}
.topbar .tb-title{font-family:var(--serif);font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .tb-days{font-size:11px;color:var(--ink-soft);background:var(--paper-3);border:1px solid var(--border);border-radius:20px;padding:2px 9px;white-space:nowrap}
main#view{padding:30px 34px 80px;max-width:1080px;width:100%;margin:0 auto}
.tabbar{display:none}

@media (max-width:900px){
  .spine{
    position:fixed;left:0;top:0;bottom:0;height:100dvh;width:262px;flex-basis:262px;
    transform:translateX(-104%);transition:transform .28s cubic-bezier(.3,.7,.3,1);
    box-shadow:8px 0 40px rgba(0,0,0,.4);
  }
  .spine.open{transform:translateX(0)}
  .topbar{display:flex}
  main#view{padding:16px 14px 96px}
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:35;
    background:rgba(255,253,247,.97);backdrop-filter:blur(10px);
    border-top:1px solid var(--border);padding:5px 4px calc(5px + env(safe-area-inset-bottom));
  }
  .tabbar button{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
    font-size:10px;color:var(--ink-faint);padding:4px 0;border-radius:8px;
  }
  .tabbar button.active{color:var(--accent);font-weight:700}
  .tabbar svg{width:20px;height:20px}
  .scrim{position:fixed;inset:0;background:rgba(20,26,24,.42);z-index:39;opacity:0;pointer-events:none;transition:opacity .25s}
  .scrim.show{opacity:1;pointer-events:auto}
}
@media (min-width:901px){ .scrim{display:none} .menu-btn{display:none!important} }

/* ---------- 見出し・紙片 ---------- */
.page-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-size:26px;display:flex;align-items:center;gap:10px}
.page-head .sub{color:var(--ink-soft);font-size:12.5px;letter-spacing:.02em;padding-bottom:5px}
.page-head .spacer{flex:1}
.eyebrow{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:2px}
.hl{background:linear-gradient(transparent 58%,var(--highlight) 58%,var(--highlight) 92%,transparent 92%);padding:0 2px}
.card{
  position:relative;background:var(--paper-2);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);
}
.card.tight{padding:14px 16px}
.card + .card{margin-top:16px}
.card-title{font-family:var(--serif);font-size:16.5px;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-title .ct-sub{font-family:var(--sans);font-size:11.5px;color:var(--ink-faint);font-weight:400}
.tape{
  position:absolute;width:76px;height:22px;background:rgba(214,198,150,.42);
  border-left:1px dashed rgba(255,255,255,.5);border-right:1px dashed rgba(255,255,255,.5);
  top:-10px;left:26px;transform:rotate(-2.4deg);pointer-events:none;
  box-shadow:0 1px 3px rgba(90,80,50,.12);
}
.tape.right{left:auto;right:26px;transform:rotate(2deg);background:rgba(180,200,190,.45)}
.card-lined{
  background-image:linear-gradient(transparent calc(1.75em - 1px),rgba(201,214,226,.55) 1px);
  background-size:100% 1.75em;background-position:0 .55em;
}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
@media (max-width:760px){ .grid-2,.grid-3{grid-template-columns:1fr} }

/* ---------- ボタン ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 18px;border-radius:10px;font-size:13.5px;font-weight:700;
  background:var(--paper-3);border:1px solid var(--border);color:var(--ink);
  transition:transform .12s,box-shadow .16s,background .16s;text-decoration:none;
  white-space:nowrap;
}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--accent);border-color:#285f5b;color:#fff;box-shadow:0 2px 0 #244e4a}
.btn-primary:hover{background:#356f6b}
.btn-vermilion{background:var(--vermilion);border-color:#95411f;color:#fff;box-shadow:0 2px 0 #7d3a1c}
.btn-ghost{background:transparent}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn-lg{padding:14px 26px;font-size:15.5px;border-radius:12px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row.end{justify-content:flex-end}

/* ---------- タグ・ピル ---------- */
.pill{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
  padding:2px 9px;border-radius:20px;background:var(--paper-3);color:var(--ink-soft);
  border:1px solid var(--border);white-space:nowrap;line-height:1.7;
}
.pill.strategy{background:var(--c-strategy-bg);color:#5b4382;border-color:#d9cdec}
.pill.management{background:var(--c-management-bg);color:#1f5c68;border-color:#c3dfe3}
.pill.technology{background:var(--c-technology-bg);color:#8a521f;border-color:#ebd5ba}
.pill.past{background:#fdf0d0;color:#8a6a12;border-color:#edddaa}
.pill.ok{background:#e4f2e4;color:#2f6b3a;border-color:#c6e2c6}
.pill.ng{background:var(--vermilion-soft);color:#9c4526;border-color:#f0cdbb}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px}
.dot.strategy{background:var(--c-strategy)}
.dot.management{background:var(--c-management)}
.dot.technology{background:var(--c-technology)}
/* ---------- KPI / スタット ---------- */
.stat{
  background:var(--paper-2);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.stat::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.55}
.stat.s-strategy::after{background:var(--c-strategy)}
.stat.s-management::after{background:var(--c-management)}
.stat.s-technology::after{background:var(--c-technology)}
.stat .lbl{display:block;font-size:11px;color:var(--ink-faint);letter-spacing:.08em;margin-bottom:2px}
.stat .val{display:block;font-family:var(--serif);font-size:30px;line-height:1.2;letter-spacing:.01em}
.stat .val small{font-size:13px;font-family:var(--sans);color:var(--ink-soft);margin-left:2px}
.stat .note{display:block;font-size:11px;color:var(--ink-soft);line-height:1.55;margin-top:2px}

/* ---------- 学習状況バー ---------- */
.bar{height:9px;background:var(--paper-3);border-radius:20px;overflow:hidden;border:1px solid rgba(0,0,0,.03)}
.bar > i{display:block;height:100%;border-radius:20px;background:var(--accent);transition:width .5s cubic-bezier(.3,.8,.3,1)}
.bar.sm{height:6px}
.bar.strategy > i{background:var(--c-strategy)}
.bar.management > i{background:var(--c-management)}
.bar.technology > i{background:var(--c-technology)}

/* ---------- ホーム ---------- */
.hero{
  position:relative;background:var(--paper-2);border:1px solid var(--border);border-radius:16px;
  padding:24px 26px;box-shadow:var(--shadow);overflow:hidden;
  background-image:linear-gradient(transparent calc(1.9em - 1px),rgba(201,214,226,.45) 1px);
  background-size:100% 1.9em;background-position:0 .4em;
}
.hero::before{content:"";position:absolute;left:38px;top:0;bottom:0;width:2px;background:var(--margin-line);opacity:.65}
.hero > *{position:relative}
.hero h2{font-size:23px;margin-bottom:6px}
.hero .lead{color:var(--ink-soft);font-size:13px;max-width:58ch}
.countdown{display:flex;align-items:baseline;gap:6px;margin:14px 0 4px}
.countdown .num{font-family:var(--serif);font-size:52px;line-height:1;color:var(--vermilion);letter-spacing:-.02em}
.countdown .unit{font-size:15px;color:var(--ink-soft)}
.countdown{flex-wrap:wrap}
.countdown .rest{font-size:12px;color:var(--ink-faint);margin-left:8px}
@media (max-width:560px){
  .countdown .num{font-size:44px}
  .countdown .rest{flex-basis:100%;margin-left:0;margin-top:4px}
  .hero{padding:18px 16px 20px}
  .hero::before{left:10px}
  .hero h2{font-size:20px}
}
.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-top:18px}
@media (max-width:560px){ .quick-grid{grid-template-columns:1fr 1fr;gap:9px} .quick{padding:11px 12px} .quick .q-t{font-size:13px} .quick .q-d{font-size:10.5px} .quick .q-ico{width:26px;height:26px} }
.quick{
  display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--paper-2);
  border:1px solid var(--border);border-radius:12px;padding:14px 15px;box-shadow:var(--shadow);
  transition:transform .14s,box-shadow .16s,border-color .16s;
}
.quick:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:#cbbfa5}
.quick .q-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:4px}
.quick .q-ico svg{width:17px;height:17px}
.quick .q-t{font-weight:700;font-size:14px}
.quick .q-d{font-size:11.5px;color:var(--ink-faint);line-height:1.5}
.quick.tone-v .q-ico{background:var(--vermilion-soft);color:var(--vermilion)}
.quick.tone-s .q-ico{background:var(--c-strategy-bg);color:var(--c-strategy)}
.quick.tone-m .q-ico{background:var(--c-management-bg);color:var(--c-management)}
.quick.tone-t .q-ico{background:var(--c-technology-bg);color:var(--c-technology)}

.today-list{list-style:none;padding:0;margin:0}
.today-list li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px}
.today-list li:last-child{border-bottom:none}
.today-list .ck{
  width:18px;height:18px;flex:0 0 18px;border:1.5px solid #b9ae96;border-radius:5px;background:#fff;
  display:grid;place-items:center;margin-top:2px;transition:background .15s,border-color .15s;
}
.today-list .ck svg{width:12px;height:12px;color:#fff;opacity:0;transition:opacity .15s}
.today-list li.done .ck{background:var(--accent);border-color:var(--accent)}
.today-list li.done .ck svg{opacity:1}
.today-list li.done .tx{text-decoration:line-through;color:var(--ink-faint)}
.today-list .tx{flex:1;min-width:0}
.today-list .meta{font-size:11px;color:var(--ink-faint);display:block}

/* ---------- クイズ ---------- */
.quiz-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.progress-track{flex:1;min-width:120px;display:flex;gap:3px}
.progress-track i{flex:1;height:7px;border-radius:3px;background:var(--paper-3);border:1px solid rgba(0,0,0,.04);transition:background .3s}
.progress-track i.ok{background:var(--accent)}
.progress-track i.ng{background:var(--vermilion)}
.progress-track i.now{background:#c7b78d}
.quiz-meta{font-size:12px;color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.quiz-meta b{font-family:var(--serif);font-size:16px;color:var(--ink)}
.timer{font-family:var(--mono);font-size:14px;font-weight:700;background:var(--paper-3);border:1px solid var(--border);padding:3px 10px;border-radius:8px;font-variant-numeric:tabular-nums}
.timer.warn{background:var(--vermilion-soft);color:#9c4526;border-color:#eec3ae;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.62}}

.q-card{position:relative;background:var(--paper-2);border:1px solid var(--border);border-radius:16px;padding:22px 24px 24px;box-shadow:var(--shadow)}
.q-card::before{content:"";position:absolute;left:44px;top:0;bottom:0;width:2px;background:var(--margin-line);opacity:.5}
.q-head{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.q-text{font-family:var(--serif);font-size:17px;line-height:1.9;margin:0 0 18px;white-space:pre-wrap}
@media (max-width:600px){ .q-text{font-size:15.5px;line-height:1.85} .q-card{padding:16px 16px 18px} .q-card::before{left:8px;opacity:.35} }
.choices{display:flex;flex-direction:column;gap:9px;margin:0;padding:0;list-style:none}
.choice{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:#fff;border:1.5px solid var(--border);border-radius:11px;padding:12px 14px;
  font-size:14px;line-height:1.7;transition:border-color .15s,background .15s,transform .1s;
}
.choice:hover{border-color:#b9a887;background:#fffef9}
.choice .k{
  width:23px;height:23px;flex:0 0 23px;border-radius:50%;border:1.5px solid #b9ae96;
  display:grid;place-items:center;font-family:var(--serif);font-size:12.5px;font-weight:700;
  color:var(--ink-soft);background:var(--paper-2);margin-top:1px;
}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.sel .k{background:var(--accent);border-color:var(--accent);color:#fff}
.choice.correct{border-color:#4c8f5a;background:#eaf5ea}
.choice.correct .k{background:#4c8f5a;border-color:#4c8f5a;color:#fff}
.choice.wrong{border-color:var(--vermilion);background:var(--vermilion-soft)}
.choice.wrong .k{background:var(--vermilion);border-color:var(--vermilion);color:#fff}
.choice[disabled]{cursor:default;transform:none!important}
.choice .mk{margin-left:auto;font-size:11px;font-weight:700;white-space:nowrap;padding-top:3px}
.choice.correct .mk{color:#2f6b3a}
.choice.wrong .mk{color:#9c4526}

.explain{margin-top:16px;border-top:1px dashed var(--border);padding-top:14px;animation:fadeUp .28s ease}
.explain .ex-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;margin-bottom:6px}
.explain .ex-head .res{font-family:var(--serif);font-size:15px}
.explain p{font-size:13px;line-height:1.85;color:var(--ink-soft);margin:0 0 .6em}
.explain .point{background:#fffbe6;border-left:3px solid #e0c04a;padding:8px 12px;border-radius:0 8px 8px 0;font-size:12.5px;color:#6b5a1c}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.quiz-foot{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.quiz-foot .spacer{flex:1}
.kbd-hint{font-size:11px;color:var(--ink-faint)}
@media (max-width:700px){ .kbd-hint{display:none} }

/* ---------- 結果 ---------- */
.score-panel{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:0 0 132px}
.ring svg{transform:rotate(-90deg);width:132px;height:132px}
.ring .ring-val{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .ring-val b{font-family:var(--serif);font-size:33px;line-height:1.1;display:block}
.ring .ring-val span{font-size:10.5px;color:var(--ink-faint);letter-spacing:.1em}
.result-verdict{font-family:var(--serif);font-size:19px;margin-bottom:4px}
.result-verdict.pass{color:#2f6b3a}
.result-verdict.near{color:#a9682b}
.result-verdict.fail{color:var(--vermilion)}

.field-rows{display:flex;flex-direction:column;gap:12px}
.field-row{display:grid;grid-template-columns:96px 1fr 78px;gap:10px;align-items:center;font-size:12.5px}
.field-row .fname{display:flex;align-items:center;gap:6px;white-space:nowrap}
.field-row .fval{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.field-row .fval b{font-family:var(--serif);font-size:15px;color:var(--ink)}
@media (max-width:600px){ .field-row{grid-template-columns:82px 1fr 66px;gap:7px;font-size:12px} }

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){ .stat-row{grid-template-columns:1fr 1fr} .stat-row .stat:last-child{grid-column:1/-1} }

.subcat-list{display:flex;flex-direction:column;gap:9px}
.subcat{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.subcat .sc-name{font-size:12.5px;display:flex;align-items:center;gap:6px;min-width:0}
.subcat .sc-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subcat .sc-num{font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.subcat .bar{grid-column:1/-1}

/* ---------- チャート ---------- */
.chart-box{position:relative;width:100%}
.chart-box canvas{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-soft);margin-top:8px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px}
.empty{
  text-align:center;padding:34px 16px;color:var(--ink-faint);font-size:13px;
  border:1.5px dashed var(--border);border-radius:12px;background:rgba(255,255,255,.4);
}
.empty .em-ico{font-size:26px;display:block;margin-bottom:6px;opacity:.6}

/* ---------- 履歴テーブル ---------- */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px}
table.tbl th{
  text-align:left;font-size:10.5px;letter-spacing:.1em;color:var(--ink-faint);font-weight:700;
  padding:8px 10px;border-bottom:1.5px solid var(--border);white-space:nowrap;text-transform:uppercase;
}
table.tbl td{padding:10px;border-bottom:1px dashed var(--border);vertical-align:middle}
table.tbl tr:hover td{background:rgba(255,251,235,.7)}
table.tbl .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.mini-bar{width:64px;height:6px;background:var(--paper-3);border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle}
.mini-bar i{display:block;height:100%;background:var(--accent);border-radius:4px}

/* ---------- ロードマップ ---------- */
.rm-week{margin-bottom:18px}
.rm-week-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rm-week-head h4{font-size:14px;display:flex;align-items:center;gap:8px}
.rm-week-head .wk-tag{font-size:10.5px;letter-spacing:.14em;background:var(--cover);color:#f2ece0;border-radius:20px;padding:2px 10px}
.rm-week-head .wk-line{flex:1;height:1px;background:var(--border)}
.rm-days{display:flex;flex-direction:column;gap:8px}
.rm-day{
  display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;
  background:var(--paper-2);border:1px solid var(--border);border-radius:11px;padding:11px 14px;
  box-shadow:0 1px 2px rgba(70,60,40,.05);
}
.rm-day.is-today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
.rm-day.is-rest{background:transparent;border-style:dashed;box-shadow:none;opacity:.85}
.rm-day.past-miss{border-color:#e3b9a5;background:#fdf6f1}
.rm-date{font-family:var(--serif);text-align:center;line-height:1.2;border-right:1px solid var(--border);padding-right:10px}
.rm-date .d{font-size:19px}
.rm-date .m{font-size:10.5px;color:var(--ink-faint)}
.rm-date .w{font-size:10px;color:var(--ink-soft);display:block}
.rm-body{min-width:0}
.rm-body .t{font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rm-body .d2{font-size:11.5px;color:var(--ink-faint);line-height:1.5;margin-top:2px}
.rm-chk{width:30px;height:30px;border-radius:8px;border:1.5px solid #c3b79c;background:#fff;display:grid;place-items:center;transition:.15s}
.rm-chk svg{width:16px;height:16px;color:#fff;opacity:0}
.rm-chk.on{background:var(--accent);border-color:var(--accent)}
.rm-chk.on svg{opacity:1}
@media (max-width:620px){
  .rm-day{
    grid-template-columns:46px 1fr;grid-template-areas:"date body" "date actions";
    gap:4px 10px;padding:10px 12px;align-items:start;
  }
  .rm-date{grid-area:date;border-right:1px solid var(--border);padding-right:8px;align-self:stretch;padding-top:2px}
  .rm-body{grid-area:body}
  .rm-day > .flex:last-child{grid-area:actions;justify-content:flex-end;margin-top:6px}
  .rm-date .d{font-size:17px}
  .rm-date .m,.rm-date .w{font-size:9.5px}
  .rm-body .t{font-size:12.5px;gap:5px}
  .rm-body .d2{font-size:11px}
}

/* ---------- フラッシュカード ---------- */
.fc-stage{perspective:1400px;max-width:520px;margin:0 auto}
.fc{
  position:relative;width:100%;min-height:260px;cursor:pointer;
  transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.8,.3,1);
}
.fc.flip{transform:rotateY(180deg)}
.fc-face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--paper-2);border:1px solid var(--border);border-radius:16px;
  box-shadow:var(--shadow-lift);padding:24px;display:flex;flex-direction:column;
  justify-content:center;overflow:auto;
}
.fc-face.back{transform:rotateY(180deg);background:linear-gradient(#fffdf7,#fbf7ea)}
.fc-face .fc-tag{position:absolute;top:14px;left:18px;font-size:10.5px;letter-spacing:.14em;color:var(--ink-faint)}
.fc-face .fc-term{font-family:var(--serif);font-size:26px;text-align:center;line-height:1.5;padding:0 10px}
.fc-face .fc-hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--ink-faint)}
.fc-face .fc-def{font-size:14px;line-height:1.95}
.fc-face .fc-def b{background:linear-gradient(transparent 60%,var(--highlight) 60%)}
.fc-face .fc-key{margin-top:10px;font-size:11.5px;color:var(--vermilion);border-top:1px dashed var(--border);padding-top:8px}
.fc-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:16px}
.fc-count{font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-soft);min-width:74px;text-align:center}
.fc-actions{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}

/* ---------- フォーム ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;letter-spacing:.04em}
.inp,select.inp,textarea.inp{
  width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;
  background:#fff;font-size:14px;transition:border-color .15s,box-shadow .15s;
}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:70px;line-height:1.7}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
.inline-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.seg{display:inline-flex;background:var(--paper-3);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:6px 13px;border-radius:7px;font-size:12.5px;color:var(--ink-soft);font-weight:700;transition:.15s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg.wide{display:flex;width:100%}
.seg.wide button{flex:1}
.chip-row{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  padding:7px 14px;border:1.5px solid var(--border);border-radius:20px;background:#fff;
  font-size:12.5px;transition:.15s;
}
.chip.on{border-color:var(--accent);background:var(--accent-soft);font-weight:700;color:var(--accent)}
.chip.s-on{border-color:var(--c-strategy);background:var(--c-strategy-bg);color:#5b4382;font-weight:700}
.chip.m-on{border-color:var(--c-management);background:var(--c-management-bg);color:#1f5c68;font-weight:700}
.chip.t-on{border-color:var(--c-technology);background:var(--c-technology-bg);color:#8a521f;font-weight:700}
.chk-line{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.chk-line input{width:17px;height:17px;accent-color:var(--accent)}

/* ---------- モーダル / トースト ---------- */
.modal-back{
  position:fixed;inset:0;background:rgba(30,36,32,.45);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:18px;
  opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(2px);
}
.modal-back.show{opacity:1;pointer-events:auto}
.modal{
  background:var(--paper-2);border:1px solid var(--border);border-radius:16px;
  width:100%;max-width:560px;max-height:88vh;overflow:auto;box-shadow:0 24px 60px -20px rgba(0,0,0,.5);
  transform:translateY(8px) scale(.985);transition:transform .22s;padding:22px 24px;
}
.modal-back.show .modal{transform:none}
.modal h3{font-size:18px;margin-bottom:4px}
.modal .m-sub{font-size:12px;color:var(--ink-faint);margin-bottom:16px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}

#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:80;opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast .t-in{
  background:var(--cover);color:#f5f0e4;padding:9px 18px;border-radius:24px;font-size:12.5px;
  box-shadow:0 8px 24px -8px rgba(0,0,0,.5);display:flex;align-items:center;gap:8px;
}
@media (max-width:900px){ #toast{bottom:78px} }

/* ---------- その他 ---------- */
.note-box{background:#fffbe6;border:1px solid #eadfae;border-radius:10px;padding:12px 14px;font-size:12.5px;color:#6b5a1c;line-height:1.8}
.note-box b{color:#514400}
.muted{color:var(--ink-faint)}
.small{font-size:11.5px}
.mt0{margin-top:0}.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.mb0{margin-bottom:0}.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.right{text-align:right}
.center{text-align:center}
.hr-dash{height:1px;border:none;border-top:1px dashed var(--border);margin:16px 0}
.nowrap{white-space:nowrap}
.hidden{display:none!important}
.scroll-x{overflow-x:auto}
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tabs button{padding:8px 14px;font-size:13px;color:var(--ink-soft);border-bottom:2.5px solid transparent;margin-bottom:-1.5px;white-space:nowrap;font-weight:700}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.qbank-item{border:1px solid var(--border);border-radius:10px;padding:10px 13px;background:#fff;margin-bottom:8px}
.qbank-item .qb-q{font-size:13px;line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qbank-item .qb-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.print-only{display:none}
@media print{
  .spine,.topbar,.tabbar,.no-print{display:none!important}
  main#view{padding:0}
  body{background:#fff}
  .card{box-shadow:none;break-inside:avoid}
}
</style>
</head>

  <aside class="spine" id="spine" aria-label="サイドバー">

      <span class="b-main">ITパスポート</span>
      <span class="b-sub">Study Notebook</span>
      <span class="b-rule"></span>
    </a>
    <nav id="sidebar-nav" aria-label="メインナビゲーション"></nav>
    <div class="spine-foot">
      <span class="count-num" id="spine-qcount">0</span>

  <div class="main-wrap">
    <header class="topbar">
      <button class="btn btn-sm btn-ghost" id="menu-btn" aria-label="メニューを開く" style="padding:6px 8px">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>

</div>

<nav class="tabbar" id="tabbar" aria-label="タブバー"></nav>

<script>
/* =========================================================================
   問題データ — ストラテジ系
   field: strategy / management / technology
   mid: 中分類, sub: 小分類（分析の最小単位）
   p: 1 のものは過去問をベースに再構成したもの, y: 出題年度
   a: 正解の添字(0-3), e: 解説, pt: 暗記ポイント
   ========================================================================= */
window.Q_STRATEGY = [
{id:"S01",field:"strategy",mid:"企業活動",sub:"経営組織",a:1,p:1,y:2024,
 q:"事業部制組織の説明として、最も適切なものはどれか。",
 c:["営業、製造、経理などの職能ごとに部門を分け、各部門の専門性を高める組織",
    "製品や市場、地域などの単位で部門を分け、各部門に意思決定権限を委譲する組織",
    "特定の課題を解決するために臨時に編成され、課題の完了とともに解散する組織",
    "経営者を補佐し、専門的な立場から助言や調査を行う組織"],
 e:"事業部制組織は、製品別・市場別・地域別などの単位で事業部を設け、各事業部に利益責任と広い権限を委譲する組織形態です。事業部ごとに完結した経営を行うため意思決定が速く、責任の所在も明確になります。1は職能別組織、3はプロジェクト組織、4はスタッフ部門の説明です。",
 pt:"事業部制＝製品・市場単位＋権限委譲＋利益責任"},

{id:"S02",field:"strategy",mid:"企業活動",sub:"経営組織",a:2,
 q:"マトリックス組織の特徴として、最も適切なものはどれか。",
 c:["一人の上司だけに報告する単純な命令系統をもつ",
    "組織の階層を極力なくし、全員が対等に意見を出し合う",
    "職能別の縦の命令系統と、製品・プロジェクト別の横の命令系統を組み合わせる",
    "本社の管理部門を廃止し、現場にすべての権限を移譲する"],
 e:"マトリックス組織は、職能別部門（縦）と製品・プロジェクト別部門（横）を掛け合わせた組織形態で、社員は二つの上司から指示を受けます。専門性の活用と目的達成の両立が図れる一方、命令系統の重複による意思決定の遅れやコンフリクトが課題になります。",
 pt:"マトリックス＝縦（職能）×横（製品・PJ）の二重命令系統"},

{id:"S03",field:"strategy",mid:"企業活動",sub:"経営組織",a:0,
 q:"カンパニー制の説明として、最も適切なものはどれか。",
 c:["社内を複数の独立した事業単位に分け、それぞれに高い自律性と資本効率などの責任をもたせる",
    "全社の業務を一つの部門に集約し、規模の経済を追求する",
    "期間を定めずに全社横断の委員会を設置し、合意形成を図る",
    "海外拠点を統括するための持株会社を設立する"],
 e:"カンパニー制は、社内を製品・地域などの単位で「社内カンパニー」に分け、それぞれをあたかも独立企業のように運営させる制度です。カンパニー社長に大幅な権限を委譲し、損益だけでなく投下資本利益率（ROI）などの資本効率まで責任を負わせる点が事業部制との違いです。",
 pt:"カンパニー制＝疑似独立企業＋資本効率（ROI）責任"},

{id:"S04",field:"strategy",mid:"企業活動",sub:"業務分析・データ利活用",a:3,p:1,y:2022,
 q:"ブレーンストーミングの4原則に含まれないものはどれか。",
 c:["他人のアイデアを批判しない","自由奔放なアイデアを歓迎する","アイデアの質より量を重視する","アイデアは必ず実現可能なものに限定する"],
 e:"ブレーンストーミングの4原則は「批判厳禁」「自由奔放」「量産歓迎」「結合改善」です。実現可能性で絞り込むのは発想段階ではなく、後の評価段階で行います。",
 pt:"4原則＝批判厳禁・自由奔放・量産歓迎・結合改善"},

{id:"S05",field:"strategy",mid:"企業活動",sub:"業務分析・データ利活用",a:1,
 q:"ある品質問題について、結果とその原因の関係を魚の骨のような図で整理する手法はどれか。",
 c:["パレート図","特性要因図","散布図","管理図"],
 e:"特性要因図（フィッシュボーン図）は、特性（結果）に対して考えられる要因を、人・機械・材料・方法などの切り口で枝分かれさせて整理する図です。パレート図は項目を件数順に並べて累積比率を見る図、散布図は2つの量の相関を見る図、管理図は工程の安定性を監視する図です。",
 pt:"特性要因図＝結果と原因の因果関係を魚の骨で整理"},

{id:"S06",field:"strategy",mid:"企業活動",sub:"業務分析・データ利活用",a:2,p:1,y:2023,
 q:"POSデータなどの購買履歴から、「ある商品と一緒に買われることの多い商品」の組合せを見つける分析手法はどれか。",
 c:["回帰分析","クラスタ分析","アソシエーション分析","主成分分析"],
 e:"アソシエーション分析（バスケット分析）は、「商品Aを買った人は商品Bも買う傾向がある」といった項目間の同時生起の関係をルールとして抽出します。支持度・信頼度・リフトといった指標でルールの強さを評価します。",
 pt:"アソシエーション分析＝「同時に買われる」組合せの発見"},

{id:"S07",field:"strategy",mid:"企業活動",sub:"会計・財務",a:1,p:1,y:2022,
 q:"販売単価が1万円、変動費率が60%、固定費が1,200万円のとき、損益分岐点売上高は何万円か。",
 c:["1,920万円","3,000万円","7,200万円","12,000万円"],
 e:"損益分岐点売上高＝固定費÷(1−変動費率)＝1,200÷(1−0.6)＝1,200÷0.4＝3,000万円です。限界利益率（1−変動費率）が40%なので、売上の40%が固定費の回収に充てられる計算になります。",
 pt:"損益分岐点売上高＝固定費÷(1−変動費率)"},

{id:"S08",field:"strategy",mid:"企業活動",sub:"会計・財務",a:0,
 q:"取得価額1,200万円、耐用年数5年、残存価額0円の資産を定額法で減価償却するとき、1年あたりの減価償却費は何万円か。",
 c:["240万円","300万円","600万円","1,200万円"],
 e:"定額法では、取得価額から残存価額を引いた金額を耐用年数で均等に割ります。(1,200−0)÷5＝240万円です。定率法の場合は未償却残高に償却率を掛けるため、初年度が最も大きくなります。",
 pt:"定額法＝(取得価額−残存価額)÷耐用年数"},

{id:"S09",field:"strategy",mid:"企業活動",sub:"会計・財務",a:2,
 q:"貸借対照表（B/S）が表すものとして、最も適切なものはどれか。",
 c:["一定期間の収益と費用から経営成績を表す","一定期間の現金の増減を表す","ある時点の資産・負債・純資産の状態を表す","製品1個あたりの原価の内訳を表す"],
 e:"貸借対照表は「ある時点」の財政状態（資産＝負債＋純資産）を示します。「一定期間」の経営成績を示すのは損益計算書（P/L）、現金の増減を示すのはキャッシュフロー計算書（C/S）です。",
 pt:"B/S＝ある時点の財政状態、P/L＝一定期間の経営成績"},

{id:"S10",field:"strategy",mid:"企業活動",sub:"会計・財務",a:3,
 q:"ROE（自己資本利益率）を求める式として、正しいものはどれか。",
 c:["当期純利益÷売上高","売上高÷総資産","当期純利益÷総資産","当期純利益÷自己資本"],
 e:"ROEは自己資本（株主資本）に対してどれだけ利益を生み出したかを示し、当期純利益÷自己資本で求めます。当期純利益÷売上高は売上高利益率、当期純利益÷総資産はROA（総資産利益率）です。",
 pt:"ROE＝純利益÷自己資本、ROA＝純利益÷総資産"},

{id:"S11",field:"strategy",mid:"企業活動",sub:"法務",a:1,p:1,y:2023,
 q:"他人のIDとパスワードを不正に入手し、その利用者になりすましてコンピュータにログインする行為を禁止している法律はどれか。",
 c:["不正競争防止法","不正アクセス行為の禁止等に関する法律","個人情報の保護に関する法律","電子署名及び認証業務に関する法律"],
 e:"不正アクセス禁止法は、他人の識別符号（ID・パスワード）を無断で入力してアクセスする行為や、そのための識別符号の不正取得・提供を禁止しています。なお、正規のIDで権限を超えて内部資料を持ち出す行為は、この法律ではなく不正競争防止法や会社の就業規則などで扱われます。",
 pt:"不正アクセス禁止法＝なりすましログイン＋ID不正取得の禁止"},

{id:"S12",field:"strategy",mid:"企業活動",sub:"法務",a:2,
 q:"個人情報保護法における「要配慮個人情報」に該当するものはどれか。",
 c:["氏名","勤務先の電話番号","病歴","メールアドレス"],
 e:"要配慮個人情報とは、人種、信条、社会的身分、病歴、犯罪の経歴、犯罪により害を被った事実など、不当な差別や偏見が生じないように取扱いに配慮を要する個人情報です。取得には原則として本人の同意が必要です。氏名や連絡先は通常の個人情報に該当します。",
 pt:"要配慮個人情報＝人種・信条・病歴・犯罪歴など（取得に本人同意）"},

{id:"S13",field:"strategy",mid:"企業活動",sub:"法務",a:0,
 q:"著作権法に関する記述として、最も適切なものはどれか。",
 c:["プログラムは著作権法で保護される著作物に含まれる","アイデアそのものが著作権法で保護される","著作権の保護期間は著作者の生存中のみである","他人が作成したプログラムは、社内利用であれば自由に複製できる"],
 e:"プログラムは著作権法上の「著作物」として保護されます。ただし保護されるのは表現であってアイデア自体ではなく、保護期間は著作者の死後70年です。社内利用目的でも、権利者の許諾なく複製することは原則として認められません。",
 pt:"プログラムも著作物。保護されるのは表現、アイデアは対象外"},

{id:"S14",field:"strategy",mid:"企業活動",sub:"法務",a:1,
 q:"労働者派遣法に基づく労働者派遣に関する記述として、最も適切なものはどれか。",
 c:["派遣労働者は派遣元企業の指揮命令を受けて派遣先で業務を行う","派遣先企業は派遣労働者に直接指揮命令を行うことができる","派遣先は派遣労働者を自由に採用してはならない","派遣契約は個人単位で結ぶ必要がある"],
 e:"労働者派遣では、雇用主は派遣元、指揮命令権者は派遣先という二重の関係になります。したがって派遣先は業務に関する直接の指揮命令ができます（1は請負の説明に近く、誤り）。契約は派遣元と派遣先の間で締結します。",
 pt:"派遣＝雇用は派遣元、指揮命令は派遣先"},

{id:"S15",field:"strategy",mid:"経営戦略マネジメント",sub:"経営戦略手法",a:2,p:1,y:2024,
 q:"自社の置かれている状況を「強み・弱み・機会・脅威」の4つの観点で整理し、経営戦略の立案に役立てる手法はどれか。",
 c:["3C分析","PPM","SWOT分析","バリューチェーン分析"],
 e:"SWOT分析は、内部環境である強み（Strength）・弱み（Weakness）と、外部環境である機会（Opportunity）・脅威（Threat）を組み合わせて戦略を導く手法です。3Cは顧客・競合・自社、PPMは市場成長率と市場占有率、バリューチェーンは業務活動の連鎖を分析します。",
 pt:"SWOT＝内部(S,W)×外部(O,T)"},

{id:"S16",field:"strategy",mid:"経営戦略マネジメント",sub:"経営戦略手法",a:0,
 q:"3C分析の3つの「C」が表す要素の組合せとして、正しいものはどれか。",
 c:["顧客・競合・自社","環境・企業・社会","製品・価格・流通","コスト・品質・納期"],
 e:"3C分析はCustomer（顧客・市場）、Competitor（競合）、Company（自社）の3つの視点から、自社が勝てる市場機会を探るフレームワークです。3は4P（マーケティングミックス）の一部です。",
 pt:"3C＝Customer / Competitor / Company"},

{id:"S17",field:"strategy",mid:"経営戦略マネジメント",sub:"経営戦略手法",a:3,p:1,y:2021,
 q:"PPM（プロダクトポートフォリオマネジメント）において、市場成長率が高く市場占有率も高い事業を表す名称はどれか。",
 c:["金のなる木","負け犬","問題児","花形"],
 e:"PPMは縦軸に市場成長率、横軸に市場占有率をとり、事業を4象限に分類します。高成長・高シェアは「花形」、低成長・高シェアは「金のなる木」、高成長・低シェアは「問題児」、低成長・低シェアは「負け犬」です。",
 pt:"花形→金のなる木→（投資は問題児へ選別）→負け犬は撤退"},

{id:"S18",field:"strategy",mid:"経営戦略マネジメント",sub:"経営戦略手法",a:1,
 q:"マイケル・ポーターが提唱したファイブフォース分析で分析する5つの要因に含まれないものはどれか。",
 c:["新規参入者の脅威","自社の財務状況","代替品の脅威","売り手（供給者）の交渉力"],
 e:"ファイブフォースは「新規参入の脅威」「代替品の脅威」「売り手の交渉力」「買い手の交渉力」「業者間の競争」の5つで業界の魅力度を分析します。自社の財務状況は内部環境であり、業界構造の分析対象ではありません。",
 pt:"5フォース＝新規参入・代替品・売り手・買い手・競争"},

{id:"S19",field:"strategy",mid:"経営戦略マネジメント",sub:"経営戦略手法",a:2,
 q:"バリューチェーン分析の説明として、最も適切なものはどれか。",
 c:["売上を製品・顧客・地域別に分解して収益性を比較する","従業員の満足度と顧客満足度の相関を分析する","業務を主活動と支援活動に分け、どの活動が付加価値を生んでいるかを分析する","競合他社の製品価格の推移を時系列で比較する"],
 e:"バリューチェーンは、調達・製造・出荷・販売・サービスといった主活動と、人事・技術開発・購買などの支援活動に業務を分解し、各活動の付加価値と強みを可視化する手法です。",
 pt:"バリューチェーン＝主活動＋支援活動の付加価値連鎖"},

{id:"S20",field:"strategy",mid:"経営戦略マネジメント",sub:"マーケティング",a:1,p:1,y:2023,
 q:"マーケティングミックス（4P）の構成要素として、正しいものはどれか。",
 c:["Product、Price、Place、Promotion","People、Process、Product、Price","Product、Price、Place、Positioning","Plan、Price、Place、Promotion"],
 e:"4PはProduct（製品）、Price（価格）、Place（流通・チャネル）、Promotion（プロモーション）の4つです。4Pを顧客側の視点に置き換えたものが4C（顧客価値・顧客負担・利便性・コミュニケーション）です。",
 pt:"4P＝Product / Price / Place / Promotion"},

{id:"S21",field:"strategy",mid:"経営戦略マネジメント",sub:"マーケティング",a:0,
 q:"顧客を「最終購買日（Recency）」「購買頻度（Frequency）」「購買金額（Monetary）」の3つの指標で分類し、優良顧客の特定などに用いる手法はどれか。",
 c:["RFM分析","ABC分析","デシル分析","バスケット分析"],
 e:"RFM分析は3つの指標の組み合わせで顧客をランク付けし、アプローチ方法を変える手法です。ABC分析は売上などの累積構成比で重点管理対象を決める手法、デシル分析は顧客を10等分して上位層を分析する手法です。",
 pt:"RFM＝Recency（最新購買日）/ Frequency（頻度）/ Monetary（金額）"},

{id:"S22",field:"strategy",mid:"経営戦略マネジメント",sub:"マーケティング",a:2,
 q:"カスタマージャーニーマップの説明として、最も適切なものはどれか。",
 c:["商品の企画から廃番までのライフサイクルを表した図","組織内の意思決定の稟議経路を表した図","顧客が認知から購買、購入後に至るまでの体験を時系列で可視化した図","競合他社との価格競争の推移を表した図"],
 e:"カスタマージャーニーマップは、顧客の認知・比較・購入・利用・推奨といった各段階での行動・感情・接点を時系列で描き、顧客体験の課題を発見するためのフレームワークです。",
 pt:"カスタマージャーニー＝顧客体験を時系列で可視化"},

{id:"S23",field:"strategy",mid:"経営戦略マネジメント",sub:"マーケティング",a:3,
 q:"アンゾフの成長マトリクスにおいて、「新市場に既存製品を投入する」戦略はどれか。",
 c:["市場浸透","製品開発","多角化","市場開拓"],
 e:"アンゾフのマトリクスは製品（既存・新規）と市場（既存・新規）の2軸で4つの成長戦略に分類します。既存製品×既存市場は市場浸透、新製品×既存市場は製品開発、既存製品×新市場は市場開拓、新製品×新市場は多角化です。",
 pt:"既存×既存=浸透、新製品=製品開発、新市場=市場開拓、両方新規=多角化"},

{id:"S24",field:"strategy",mid:"経営戦略マネジメント",sub:"ビジネス戦略と目標・評価",a:1,
 q:"バランススコアカード（BSC）の4つの視点に含まれないものはどれか。",
 c:["財務の視点","技術の視点","顧客の視点","学習と成長の視点"],
 e:"BSCの4つの視点は「財務」「顧客」「業務プロセス」「学習と成長」です。財務指標だけでなく、その先行指標となる非財務指標を組み合わせて戦略の進捗を管理します。「技術の視点」は含まれません。",
 pt:"BSC＝財務・顧客・業務プロセス・学習と成長"},

{id:"S25",field:"strategy",mid:"経営戦略マネジメント",sub:"ビジネス戦略と目標・評価",a:2,
 q:"KGIとKPIの関係を説明したものとして、最も適切なものはどれか。",
 c:["KGIは中間目標、KPIは最終目標を表す","KGIとKPIは同一の指標を呼び方を変えたものである","KGIは最終的に達成すべき目標、KPIはその達成度を測る中間指標である","KPIは財務指標に限定され、KGIは非財務指標に限定される"],
 e:"KGI（重要目標達成指標）は最終ゴール、KPI（重要業績評価指標）はKGI達成に向けた中間の達成度を測る指標です。「KGI：売上100億円」に対して「KPI：月間新規顧客数」のように設定します。",
 pt:"KGI＝ゴール、KPI＝途中の計器"},

{id:"S26",field:"strategy",mid:"経営戦略マネジメント",sub:"ビジネス戦略と目標・評価",a:0,
 q:"コアコンピタンスの説明として、最も適切なものはどれか。",
 c:["他社が容易にまねできない、自社の中核となる能力","自社のすべての業務プロセスを標準化した仕組み","市場占有率が最も高い製品","短期的に最も利益率の高い事業"],
 e:"コアコンピタンスは、顧客に価値を提供し、競合他社が模倣しにくく、複数の製品・事業に展開できる自社の中核的能力です。事業の選択と集中やアウトソーシングの判断基準にもなります。",
 pt:"コアコンピタンス＝模倣困難・複数事業へ展開可能な中核能力"},

{id:"S27",field:"strategy",mid:"ビジネスインダストリ",sub:"ビジネスシステム",a:3,p:1,y:2022,
 q:"ERPの説明として、最も適切なものはどれか。",
 c:["顧客からの問合せに自動応答するシステム","設計図面を3次元で作成するシステム","商品の販売時点の情報を収集するシステム","経営資源を一元管理し、全社の業務を統合的に最適化するシステム"],
 e:"ERP（Enterprise Resource Planning）は、会計・販売・購買・生産・在庫・人事といった基幹業務のデータを単一のデータベースで一元管理し、経営資源の全体最適を図る考え方とシステムです。部門ごとの部分最適を防ぐ効果があります。",
 pt:"ERP＝基幹業務を一元管理し全社最適へ"},

{id:"S28",field:"strategy",mid:"ビジネスインダストリ",sub:"ビジネスシステム",a:1,
 q:"CRMの目的として、最も適切なものはどれか。",
 c:["調達から販売までの物流を効率化する","顧客情報を一元管理し、長期的な顧客関係を強化して売上を伸ばす","工場の生産設備を自動制御する","従業員の勤怠を管理する"],
 e:"CRM（Customer Relationship Management）は、顧客との接点で得た情報を一元管理し、一人ひとりの顧客に合わせた対応を行うことで、顧客満足度とLTV（顧客生涯価値）を高める仕組みです。営業活動を支援するSFAと組み合わせて導入されることが多いです。",
 pt:"CRM＝顧客関係の強化、SFA＝営業支援"},

{id:"S29",field:"strategy",mid:"ビジネスインダストリ",sub:"ビジネスシステム",a:2,
 q:"SCMの説明として、最も適切なものはどれか。",
 c:["自社の業務プロセスを抜本的に再設計する","顧客の購買履歴から嗜好を分析する","調達・生産・物流・販売をまたぐ供給の流れ全体を最適化する","製品の設計から廃棄までの環境負荷を評価する"],
 e:"SCM（Supply Chain Management）は、原材料の調達から生産、在庫、物流、販売までのサプライチェーン全体の情報を共有し、全体としてのリードタイム短縮や在庫削減を図る考え方です。",
 pt:"SCM＝調達から販売までの「流れ」全体を最適化"},

{id:"S30",field:"strategy",mid:"ビジネスインダストリ",sub:"ビジネスシステム",a:0,
 q:"POSシステムの説明として、最も適切なものはどれか。",
 c:["販売時点で商品の売上情報を収集し、在庫管理や発注に活用するシステム","工場の設備の稼働状況を監視するシステム","顧客の問合せ履歴を管理するシステム","文書を電子化して保存するシステム"],
 e:"POS（Point of Sale）は、レジで商品が販売された時点の商品・数量・時刻などの情報を収集するシステムです。集めたデータは在庫管理、品揃えの最適化、需要予測などに活用されます。",
 pt:"POS＝販売時点情報管理（いつ・何が・いくつ売れたか）"},

{id:"S31",field:"strategy",mid:"ビジネスインダストリ",sub:"エンジニアリングシステム",a:1,
 q:"CADで作成した設計データを基に、工作機械を制御して製品を加工するシステムはどれか。",
 c:["CAE","CAM","CIM","MRP"],
 e:"CAM（Computer Aided Manufacturing）は、CADの設計データから加工手順や工具経路を生成し、工作機械を数値制御して自動加工するシステムです。CAEは設計の妥当性をシミュレーションで評価するもの、MRPは資材所要量計画です。",
 pt:"CAD＝設計、CAM＝製造、CAE＝解析・シミュレーション"},

{id:"S32",field:"strategy",mid:"ビジネスインダストリ",sub:"e-ビジネス",a:2,
 q:"ロングテールの説明として、最も適切なものはどれか。",
 c:["売れ筋商品だけを絞り込んで販売する戦略","期間限定で価格を下げて集客する戦略","販売数は少ないが品揃えを豊富にすることで、合計の売上を大きくする戦略","広告収入を主な収益源とする戦略"],
 e:"ロングテールは、ネット通販のように陳列・在庫の制約が小さい環境で、販売機会の少ない多数の商品（ロングテール部分）を揃えることで、全体の売上を伸ばす考え方です。",
 pt:"ロングテール＝少数販売の多数商品の合算で稼ぐ"},

{id:"S33",field:"strategy",mid:"ビジネスインダストリ",sub:"e-ビジネス",a:0,
 q:"O2Oの説明として、最も適切なものはどれか。",

 e:"WBSは、プロジェクトで必要となる成果物や作業を、管理できる大きさになるまで階層的に分解したものです。作業の漏れ防止、見積りの基礎、進捗管理の単位として使います。3はアローダイアグラム（ネットワーク図）です。",
 pt:"WBS＝作業を階層分解。漏れ防止と見積りの基礎"},

{id:"M24",field:"management",mid:"プロジェクトマネジメント",sub:"プロジェクトマネジメント",a:3,
 q:"アローダイアグラムにおいて、クリティカルパスとは何か。",
 c:["作業時間が最も短い経路","費用が最も少なく済む経路","関係者が最も多い経路","プロジェクト全体の所要日数を決める、最も時間のかかる経路"],
 e:"クリティカルパスは、開始から終了までの経路のうち所要時間が最長の経路で、プロジェクト全体の最短完了日数を決定します。この経路上の作業が1日遅れると全体も1日遅れるため、重点的に管理します。",
 pt:"クリティカルパス＝最長経路＝全体の所要日数を決める"},

{id:"M25",field:"management",mid:"プロジェクトマネジメント",sub:"プロジェクトマネジメント",a:0,
 q:"あるプロジェクトのアローダイアグラムで、A(3日)→B(4日)→D(2日)の経路と、A(3日)→C(7日)→D(2日)の経路があるとき、全体の所要日数は何日か。",
 c:["12日","9日","10日","14日"],
 e:"A→B→Dは3+4+2=9日、A→C→Dは3+7+2=12日です。クリティカルパスは最長の12日の経路なので、全体の所要日数は12日になります。短い経路には余裕時間（フロート）があります。",
 pt:"複数経路は「最長」を全体日数とする"},

{id:"M26",field:"management",mid:"プロジェクトマネジメント",sub:"プロジェクトマネジメント",a:2,
 q:"プロジェクトのリスク対応のうち、「リスクの発生確率と影響を小さくするために事前の対策をとる」ものを何というか。",
 c:["リスク回避","リスク受容","リスク軽減","リスク転嫁"],
 e:"リスク対応には、発生の原因をなくす回避、確率や影響を下げる軽減、保険や外部委託で他者に移す転嫁、影響が小さいと認めて備える受容があります。事前対策で確率・影響を下げるのは軽減です。",
 pt:"リスク対応＝回避・軽減・転嫁・受容"},

{id:"M27",field:"management",mid:"プロジェクトマネジメント",sub:"プロジェクトマネジメント",a:1,
 q:"EVM（アーンドバリューマネジメント）で用いる指標のうち、出来高（EV）から実コスト（AC）を引いた値は何を表すか。",
 c:["スケジュールの進み具合","コストの余裕または超過","品質の達成度","リスクの大きさ"],
 e:"EV−ACはコスト差異（CV）で、正なら予算内、負なら予算超過を意味します。進捗はEV−PV（スケジュール差異SV）や、EV÷PV（スケジュール効率SPI）で判断します。",
 pt:"CV＝EV−AC（コスト）、SV＝EV−PV（進捗）"},

{id:"M28",field:"management",mid:"プロジェクトマネジメント",sub:"プロジェクトマネジメント",a:3,
 q:"プロジェクト憲章の説明として、最も適切なものはどれか。",
 c:["プロジェクト終了時に提出する最終報告書","作業手順を詳細に記述した設計書","メンバーの勤務評価を記録する文書","プロジェクトの目的・目標・体制・権限を公式に認める文書"],
 e:"プロジェクト憲章は、プロジェクトの存在を公式に認可し、目的・目標・スコープ・主要な成果物・プロジェクトマネージャの権限などを明示する文書です。プロジェクト開始時に発行されます。",
 pt:"プロジェクト憲章＝プロジェクトの公式な認可文書"},

{id:"M29",field:"management",mid:"サービスマネジメント",sub:"サービスマネジメントプロセス",a:2,p:1,y:2022,
 q:"ITILにおけるインシデント管理の目的として、最も適切なものはどれか。",

 e:"インシデント管理は、サービスの中断や品質低下が発生したときに、暫定的な回避策を含めてできるだけ早くサービスを復旧させ、ビジネスへの影響を最小化することを目的とします。原因の根本追究は問題管理が担当します。",
 pt:"インシデント管理＝早期復旧、問題管理＝根本原因"},

{id:"M30",field:"management",mid:"サービスマネジメント",sub:"サービスマネジメントプロセス",a:1,
 q:"ITILにおける問題管理の説明として、最も適切なものはどれか。",
 c:["利用者からの問合せに1次対応する","インシデントの根本原因を追究し、再発を防止する","変更を承認し、リリースを統制する","サービスレベルを合意する"],
 e:"問題管理は、複数のインシデントの背後にある根本原因を特定し、既知のエラーとして記録・管理することで再発を防ぎます。1はサービスデスク、3は変更管理・リリース管理の役割です。",
 pt:"問題管理＝再発防止（根本原因の除去）"},

{id:"M31",field:"management",mid:"サービスマネジメント",sub:"サービスマネジメントプロセス",a:0,
 q:"SLAの説明として、最も適切なものはどれか。",
 c:["サービス提供者と利用者の間で合意する、サービスの品質水準と責任範囲","サービス提供者が一方的に定める料金表","システムの構成情報を記録した台帳","障害発生時の連絡先一覧"],
 e:"SLA（Service Level Agreement）は、サービスの可用性・応答時間・復旧時間などの品質水準と、守れなかった場合の責任を、提供者と利用者の間で合意した文書です。合意に至らない目標値はSLMの内部目標として区別します。",
 pt:"SLA＝提供者と利用者の品質水準の合意"},

{id:"M32",field:"management",mid:"サービスマネジメント",sub:"サービスの運用",a:3,
 q:"サービスデスクの機能のうち、専門知識をもつスタッフが高度な問合せに対応するレベルはどれか。",
 c:["0次サポート","1次サポート","2次サポート","3次サポート"],
 e:"一般に、自動応答やFAQが0次、初期対応の窓口が1次、専門スタッフによる詳細対応が2次、ベンダや開発部門などによる根本対応が3次と呼ばれます。利用者と直接やり取りしながら専門的に対応するのは2次サポートです。",
 pt:"0次＝自動応答、1次＝窓口、2次＝専門、3次＝ベンダ・開発"},

{id:"M33",field:"management",mid:"サービスマネジメント",sub:"サービスの運用",a:1,
 q:"データのバックアップ方式のうち、毎日すべてのデータをバックアップする方式はどれか。",
 c:["差分バックアップ","フルバックアップ","増分バックアップ","スナップショット"],
 e:"フルバックアップは対象データ全体を毎回取得するため、復旧は1回のリストアで済みますが、時間と容量を多く消費します。差分は前回のフル以降の変更分、増分は前回のバックアップ以降の変更分を取得します。",
 pt:"フル＝全体、差分＝前回フル以降、増分＝前回バックアップ以降"},

{id:"M34",field:"management",mid:"サービスマネジメント",sub:"ファシリティマネジメント",a:2,
 q:"データセンターのファシリティ対策として、最も適切なものはどれか。",
 c:["サーバのOSに最新のセキュリティパッチを適用する","データベースのアクセス権限を最小化する","無停電電源装置（UPS）や自家発電設備を設置する","通信データを暗号化する"],
 e:"ファシリティマネジメントは、建物・電源・空調・消火設備などの設備環境を管理することです。UPSや非常用発電機は停電時の稼働継続のための設備対策です。1〜2はシステム・情報の管理、4は通信の対策です。",
 pt:"ファシリティ＝電源・空調・消火・耐震などの設備対策"},

{id:"M35",field:"management",mid:"システム監査",sub:"システム監査",a:1,p:1,y:2023,
 q:"システム監査人の役割として、最も適切なものはどれか。",
 c:["監査対象システムの設計と開発を自ら担当する","監査対象から独立した立場で、情報システムの管理状況を検証・評価し、改善を勧告する","経営会議でIT投資の最終決定を行う","システムの運用業務を日常的に代行する"],
 e:"システム監査人は、監査対象部門から独立した立場で、情報システムの企画・開発・運用・保守が適切に行われているかを検証・評価し、問題点について改善勧告を行います。自ら開発・運用を行うと独立性が損なわれます。",
 pt:"システム監査人＝独立した立場で検証・評価・改善勧告"},

{id:"M36",field:"management",mid:"システム監査",sub:"システム監査",a:3,
 q:"システム監査における「予備調査」の目的として、最も適切なものはどれか。",
 c:["監査報告書を作成する","改善勧告に対するフォローアップを行う","本番環境でデータの完全性を検証する","監査計画を具体化するために、対象の概要や業務内容を把握する"],
 e:"予備調査は本調査の前に行い、監査対象の業務概要、組織、使用しているシステム、過去の監査結果などを把握して、監査の着眼点や手続きを具体化します。本調査では証拠を収集して検証・評価します。",
 pt:"予備調査＝概要把握と監査計画の具体化、本調査＝証拠収集と評価"},

{id:"M37",field:"management",mid:"システム監査",sub:"システム監査",a:0,

 e:"監査証拠は、監査人が結論を導き、監査意見を裏付けるために収集する資料や事実です。十分性・適切性が求められ、ヒアリング、資料閲覧、観察、分析的手続などで収集します。",
 pt:"監査証拠＝意見の裏付け。十分性と適切性が必要"},

{id:"M38",field:"management",mid:"システム監査",sub:"システム監査",a:2,
 q:"システム監査の手順として、一般的な流れはどれか。",
 c:["本調査→予備調査→監査報告→フォローアップ","監査報告→予備調査→本調査→フォローアップ","監査計画→予備調査→本調査→監査報告→フォローアップ","フォローアップ→本調査→予備調査→監査報告"],
 e:"システム監査は、監査計画の策定、予備調査、本調査（証拠収集・検証）、監査報告（意見表明・改善勧告）、フォローアップ（改善状況の確認）の順に進めます。",
 pt:"計画→予備→本調査→報告→フォローアップ"},

{id:"M39",field:"management",mid:"システム監査",sub:"システム監査",a:1,
 q:"システム監査における「協調型監査」の特徴として、最も適切なものはどれか。",
 c:["監査人が一方的に問題点を指摘して終了する","被監査部門と協力しながら改善につなげることを重視する","監査結果を公表しないことを条件とする","外部の監査法人にすべてを委託する"],
 e:"協調型監査は、監査人が被監査部門とコミュニケーションを取りながら、問題の背景を共有し、実効性のある改善策の策定を支援する考え方です。指摘することが目的ではなく、組織の改善が目的です。",
 pt:"協調型監査＝被監査部門と協力して改善へ"},

{id:"M40",field:"management",mid:"システム監査",sub:"システム監査",a:3,
 q:"システム監査人が職業倫理として遵守すべき事項に該当しないものはどれか。",
 c:["監査で知り得た情報の守秘","公正かつ誠実な態度の保持","監査業務に必要な専門能力の維持向上","監査結果を被監査部門の同意がある場合に限り報告する"],

 pt:"監査報告は依頼者へ。同意の有無で変えられない"}

{id:"T11",field:"technology",mid:"基礎理論",sub:"アルゴリズムとプログラミング",a:3,
 q:"プログラムの制御構造のうち、「ある条件が満たされている間、処理を繰り返す」ものを何というか。",
 c:["順次構造","選択構造","再帰構造","反復（繰り返し）構造"],
 e:"制御構造の基本は、上から順に実行する順次構造、条件で分岐する選択構造、条件を満たす間繰り返す反復構造の3つです。再帰は関数が自分自身を呼び出す手法で、制御構造の分類とは別の概念です。",
 pt:"基本3構造＝順次・選択・反復"},

{id:"T12",field:"technology",mid:"基礎理論",sub:"アルゴリズムとプログラミング",a:2,
 q:"変数の値を一時的に保存しておくために使われる、後に入れたものを先に取り出すデータ構造はどれか。",
 c:["キュー","配列","スタック","リスト"],
 e:"スタックはLIFO（Last In First Out：後入れ先出し）のデータ構造で、関数の呼び出し履歴やUndo機能に使われます。キューはFIFO（先入れ先出し）で、印刷待ち行列などに使われます。",
 pt:"スタック＝LIFO、キュー＝FIFO"},

{id:"T13",field:"technology",mid:"コンピュータ構成要素",sub:"プロセッサ",a:1,p:1,y:2024,
 q:"CPUの性能指標である「クロック周波数」の説明として、最も適切なものはどれか。",
 c:["1秒間に実行できる命令の数","1秒間に発生するクロックパルスの回数","CPUが一度に処理できるデータのビット幅","CPUが内蔵する演算器の個数"],
 e:"クロック周波数は、CPUが処理のタイミングをとるクロックパルスの1秒あたりの回数で、Hz（ヘルツ）で表されます。一般に高いほど処理が速いですが、実際の性能は1クロックあたりの処理内容やコア数にも左右されます。",
 pt:"クロック周波数＝1秒あたりのパルス数（Hz）"},

{id:"T14",field:"technology",mid:"コンピュータ構成要素",sub:"プロセッサ",a:0,
 q:"CPUの高速化手法のうち、1つの命令の処理を複数の段階に分け、異なる命令の各段階を並行して実行する方式はどれか。",
 c:["パイプライン処理","デュアルコア","キャッシュメモリ","DMA"],
 e:"パイプライン処理は、命令の取得・解読・実行などの段階をずらして並行処理し、スループットを向上させます。分岐命令が発生するとパイプラインが乱れる（分岐ハザード）ため、分岐予測などの技術が併用されます。",
 pt:"パイプライン＝命令の段階を並行実行"},

{id:"T15",field:"technology",mid:"コンピュータ構成要素",sub:"メモリ",a:2,
 q:"キャッシュメモリの説明として、最も適切なものはどれか。",
 c:["電源を切ると内容が消える補助記憶装置","CPUと主記憶の速度差を埋めるために、主記憶より高速で小容量の記憶装置","大容量で安価な補助記憶装置","データを永続的に保存する光ディスク"],
 e:"キャッシュメモリは、CPUと主記憶装置の処理速度の差を埋めるために、CPU内部や近傍に置かれる高速・小容量のメモリです。頻繁に使うデータを置くことで、主記憶へのアクセス回数を減らします。",
 pt:"キャッシュ＝CPUと主記憶の速度差を埋める高速小容量メモリ"},

{id:"T16",field:"technology",mid:"コンピュータ構成要素",sub:"メモリ",a:3,
 q:"DRAMとSRAMの比較として、正しいものはどれか。",
 c:["SRAMの方が大容量で安価である","DRAMの方が高速である","どちらも電源を切っても内容が保持される","SRAMは高速だが高価で、DRAMは安価だがリフレッシュが必要"],
 e:"SRAMはフリップフロップ回路で構成され高速ですが、1ビットあたりの回路が大きく高価です。DRAMはコンデンサに電荷を蓄える方式で集積度が高く安価ですが、時間とともに電荷が失われるためリフレッシュ動作が必要です。どちらも揮発性です。",
 pt:"SRAM＝高速・高価・リフレッシュ不要、DRAM＝安価・リフレッシュ必要"},

{id:"T17",field:"technology",mid:"コンピュータ構成要素",sub:"入出力デバイス",a:1,
 q:"RFIDの説明として、最も適切なものはどれか。",
 c:["レーザーでバーコードを読み取る装置","電波を用いて非接触でタグの情報を読み書きする仕組み","指紋や静脈など生体情報で個人を識別する仕組み","赤外線で人感を検知するセンサ"],
 e:"RFID（Radio Frequency Identification）は、ICタグとリーダーの間で電波を使って非接触で情報をやり取りする技術です。ICカードによる入退室管理、商品の流通管理、自動料金収受などに利用されます。",
 pt:"RFID＝電波で非接触にICタグを読み書き"},

{id:"T18",field:"technology",mid:"コンピュータ構成要素",sub:"入出力デバイス",a:2,
 q:"液晶ディスプレイの性能指標のうち、画面の解像度を表すものはどれか。",
 c:["リフレッシュレート","応答時間","1920×1080ドット","視野角"],
 e:"解像度は画面を構成する画素（ドット）の数で表し、1920×1080は横1920×縦1080ドットであることを示します。リフレッシュレートは1秒間の画面更新回数、応答時間は色の変化に要する時間です。",
 pt:"解像度＝横×縦のドット数"},

{id:"T19",field:"technology",mid:"コンピュータ構成要素",sub:"入出力デバイス",a:0,
 q:"3Dプリンタの方式のうち、光硬化性樹脂にレーザーを照射して一層ずつ硬化させて造形する方式はどれか。",
 c:["光造形方式","熱溶解積層方式","粉末焼結方式","インクジェット方式"],
 e:"光造形方式は、液状の光硬化性樹脂に紫外線レーザーなどを照射し、硬化した層を積み重ねて造形します。熱溶解積層方式は樹脂を加熱溶融して押し出します。",
 pt:"光造形＝液状樹脂を光で硬化"},

{id:"T20",field:"technology",mid:"ソフトウェア",sub:"オペレーティングシステム",a:1,p:1,y:2022,
 q:"OSの役割として、最も適切なものはどれか。",
 c:["表計算や文書作成などの業務機能を提供する","ハードウェアを管理し、アプリケーションに共通の機能を提供する","ネットワーク間の通信を中継する","データベースを管理する"],
 e:"OS（基本ソフトウェア）は、CPUやメモリ、入出力装置などのハードウェア資源を管理し、アプリケーションが動くための共通基盤を提供します。ファイル管理、プロセス管理、メモリ管理、入出力管理などが主な機能です。",
 pt:"OS＝ハードウェア管理＋アプリへの共通機能提供"},

{id:"T21",field:"technology",mid:"ソフトウェア",sub:"オペレーティングシステム",a:2,
 q:"実記憶の容量が不足したときに、補助記憶装置の一部を仮想的なメモリとして使う技術はどれか。",
 c:["キャッシュ","スプーリング","仮想メモリ","ページング"],
 e:"仮想メモリは、補助記憶装置の一部をメモリとして見せかけ、実記憶より大きなプログラムを実行可能にします。なお、メモリと補助記憶の間でデータを入れ替える具体的な方式がページングです。",
 pt:"仮想メモリ＝補助記憶をメモリに見せかける"},

{id:"T22",field:"technology",mid:"ソフトウェア",sub:"ファイルシステム",a:0,
 q:"ファイルの拡張子とその内容の組合せとして、最も適切なものはどれか。",
 c:[".csv — カンマで区切られた表形式のデータ",".exe — 画像データ",".html — 音声データ",".zip — 動画データ"],
 e:".csvはテキストの表形式データ、.exeは実行可能プログラム、.htmlはWebページの記述、.zipは圧縮ファイルです。拡張子はファイルの種類を判別する手がかりになります。",
 pt:"拡張子はファイル種別の目印"},

{id:"T23",field:"technology",mid:"ソフトウェア",sub:"ファイルシステム",a:1,
 q:"ファイルシステムのうち、フラッシュメモリ向けに設計され、書き換え回数の平準化（ウェアレベリング）を行うものはどれか。",
 c:["FAT32","exFAT","NTFS","ext4"],
 e:"exFATはSDカードやUSBメモリなどフラッシュメモリ向けに設計されたファイルシステムで、大容量ファイルを扱えます。ウェアレベリングはフラッシュメモリの特定ブロックへの書き換え集中を避ける制御です。",
 pt:"exFAT＝フラッシュメモリ向け。4GB超のファイルも扱える"},

{id:"T24",field:"technology",mid:"ソフトウェア",sub:"オープンソースソフトウェア",a:2,
 q:"オープンソースソフトウェア（OSS）の説明として、最も適切なものはどれか。",
 c:["無料で利用できるがソースコードは非公開のソフトウェア","商用利用が一切禁止されているソフトウェア","ソースコードが公開され、ライセンス条件の下で自由に利用・改変・再配布できるソフトウェア","特定の企業だけが利用できるソフトウェア"],
 e:"OSSはソースコードが公開され、ライセンスに従って利用・変更・再配布ができるソフトウェアです。無償とは限らず、サポートが有償の場合もあります。GPLのように派生物の公開を求めるライセンスもあります。",
 pt:"OSS＝ソース公開＋ライセンスに従い改変・再配布可"},

{id:"T25",field:"technology",mid:"ソフトウェア",sub:"オープンソースソフトウェア",a:3,
 q:"GPL（GNU General Public License）の特徴として、最も適切なものはどれか。",
 c:["ソースコードの公開を一切求めない","商用利用を禁止している","改変したソフトウェアの再配布を禁止している","GPLのソフトウェアを組み込んだ派生物もGPLで公開する必要がある"],
 e:"GPLはコピーレフトの考え方に基づき、GPLソフトウェアを組み込んだ派生物を配布する際には、同じGPL条件でのソース公開を要求します。商用利用は可能です。",
 pt:"GPL＝コピーレフト。派生物もGPL公開"},

{id:"T26",field:"technology",mid:"ソフトウェア",sub:"オープンソースソフトウェア",a:0,
 q:"「無保証」であることを条件に、作者が著作権を保持したまま自由な再配布を認める、BSDライセンスの特徴はどれか。",
 c:["派生物のソース公開を求めない緩やかなライセンスである","派生物のソース公開を必ず求める","特許の利用を一切認めない","商用利用を禁止している"],
 e:"BSDライセンスはGPLと異なり、派生物のソース公開を求めない「寛容型（パーミッシブ）」ライセンスです。著作権表示を保持すれば、自由に改変・再配布・商用利用できます。",
 pt:"BSD＝寛容型。ソース公開義務なし（表示は必要）"},

{id:"T27",field:"technology",mid:"ソフトウェア",sub:"ソフトウェア（その他）",a:1,
 q:"ミドルウェアの説明として、最も適切なものはどれか。",
 c:["CPUやメモリなどの物理的な装置","OSとアプリケーションの間に位置し、共通機能を提供するソフトウェア","利用者が直接操作する業務アプリケーション","ハードウェアを製造するための設計図"],
 e:"ミドルウェアは、OSとアプリケーションの中間層で、データベース管理、Webサーバ、通信制御などの共通機能を提供します。アプリケーション開発の効率化と、ハードウェアの差異の吸収を担います。",
 pt:"ミドルウェア＝OSとアプリの間の共通機能"},

{id:"T28",field:"technology",mid:"ソフトウェア",sub:"ソフトウェア（その他）",a:2,
 q:"Webブラウザで動作するプログラムのうち、サーバ側で実行されるものはどれか。",
 c:["JavaScript（クライアント側）","HTML","PHP","CSS"],
 e:"PHPはサーバ側で実行され、生成したHTMLをクライアントに返すサーバサイドスクリプトです。JavaScriptは主にブラウザ（クライアント）側で動作し、HTML/CSSは文書の構造と見た目を定義するものです。",
 pt:"サーバサイド＝PHP・Java・Python、クライアント＝JavaScript"},

{id:"T29",field:"technology",mid:"ハードウェア",sub:"ハードウェア",a:1,
 q:"コンピュータの5大装置に含まれないものはどれか。",
 c:["制御装置","通信装置","演算装置","記憶装置"],
 e:"コンピュータの5大装置は、制御装置、演算装置、記憶装置、入力装置、出力装置です。制御装置と演算装置を合わせてCPUと呼びます。通信装置は5大装置には含まれません。",
 pt:"5大装置＝制御・演算・記憶・入力・出力"},

{id:"T30",field:"technology",mid:"ハードウェア",sub:"ハードウェア",a:0,
 q:"入力装置に該当するものはどれか。",
 c:["イメージスキャナ","プリンタ","ディスプレイ","スピーカ"],
 e:"入力装置はコンピュータにデータを与える装置で、キーボード、マウス、イメージスキャナ、マイクなどがあります。プリンタ、ディスプレイ、スピーカは出力装置です。",
 pt:"入力＝キーボード・マウス・スキャナ、出力＝プリンタ・画面・音"},

{id:"T31",field:"technology",mid:"ハードウェア",sub:"ハードウェア",a:3,
 q:"USBの特徴として、最も適切なものはどれか。",
 c:["一つの装置しか接続できない","電源の供給はできない","差し込む向きが決まっており、逆向きには挿せない","電力供給とデータ通信を1本のケーブルで行える"],
 e:"USBはデータ通信と電力供給を1本のケーブルで行える汎用インタフェースで、ハブを使って最大127台まで接続できます。Type-Cは向きを気にせず挿せる規格です。",
 pt:"USB＝データ＋給電を1本で。ホットプラグ対応"},

{id:"T32",field:"technology",mid:"ハードウェア",sub:"ハードウェア",a:2,
 q:"RAID1の説明として、最も適切なものはどれか。",
 c:["複数のディスクにデータを分散して高速化する","データとパリティを分散して記録する","2台のディスクに同じデータを書き込み、冗長性を確保する","ディスクを1台だけ使用する"],
 e:"RAID1（ミラーリング）は、同じデータを2台以上のディスクに二重に書き込む方式で、1台故障してもデータを失わず、読み出しも高速ですが、記憶容量の利用効率は50%になります。RAID0は分散（ストライピング）で冗長性なし、RAID5はパリティ分散です。",
 pt:"RAID1＝ミラーリング。容量効率50%、冗長性あり"},

{id:"T33",field:"technology",mid:"ハードウェア",sub:"ハードウェア",a:1,
 q:"組込みシステムの説明として、最も適切なものはどれか。",
 c:["汎用的なPCとして自由にアプリを追加できる","家電や自動車など特定の機能を実現するために機器に組み込まれたシステム","企業の基幹業務を処理する大型コンピュータ","インターネット上のサービスを提供するサーバ"],
 e:"組込みシステムは、家電、自動車、産業機械などの製品内部に組み込まれ、その製品に特化した機能を制御するシステムです。リアルタイム性や省電力性、長期の安定動作が重視されます。",
 pt:"組込み＝機器に内蔵され特定機能を制御"},

{id:"T34",field:"technology",mid:"技術要素",sub:"データベース",a:2,p:1,y:2023,
 q:"関係データベースにおいて、表の行を一意に識別するためのキーを何というか。",
 c:["外部キー","複合キー","主キー","候補キー"],
 e:"主キーは、表の中で行を一意に識別できる列（または列の組合せ）で、NULL値や重複を許しません。他の表の主キーを参照する列は外部キーと呼び、表同士の関連付けに使います。",
 pt:"主キー＝行の一意識別。NULL・重複不可"},

{id:"T35",field:"technology",mid:"技術要素",sub:"データベース",a:0,
 q:"SQLのSELECT文に関する説明として、最も適切なものはどれか。",
 c:["表から条件に合う行を取り出す","表に新しい行を追加する","表の行を削除する","表の構造を変更する"],
 e:"SELECT文はデータの検索（抽出）に使います。INSERTは追加、UPDATEは更新、DELETEは削除、ALTERは表構造の変更です。SELECTはデータ操作言語（DML）に分類されます。",
 pt:"SELECT＝検索、INSERT＝追加、UPDATE＝更新、DELETE＝削除"},

{id:"T36",field:"technology",mid:"技術要素",sub:"データベース",a:3,
 q:"データベースの正規化の目的として、最も適切なものはどれか。",
 c:["データの検索速度を必ず向上させる","データのバックアップを自動化する","データを暗号化して安全にする","データの重複を排除し、更新時の矛盾（更新異常）を防ぐ"],
 e:"正規化は、データの重複をなくし、1つの事実を1か所にのみ保持するように表を整理する作業です。これにより更新漏れや矛盾（更新異常）を防ぎます。ただし正規化を進めると表が分割され、検索に結合が必要になり性能が落ちる場合もあります。",
 pt:"正規化＝重複排除で更新異常を防ぐ"},

{id:"T37",field:"technology",mid:"技術要素",sub:"データベース",a:1,
 q:"ACID特性のうち、「トランザクションの処理がすべて実行されるか、まったく実行されないかのどちらかである」性質はどれか。",
 c:["原子性（Atomicity）","一貫性（Consistency）","分離性（Isolation）","永続性（Durability）"],
 e:"原子性は「all or nothing」の性質で、途中で失敗した場合はロールバックして元の状態に戻します。一貫性は整合性の維持、分離性は同時実行の相互干渉の排除、永続性は完了後の結果が失われないことを表します。",
 pt:"ACID＝原子性・一貫性・分離性・永続性"},

{id:"T38",field:"technology",mid:"技術要素",sub:"データベース",a:2,
 q:"データウェアハウスの説明として、最も適切なものはどれか。",
 c:["日々の業務処理を高速に行うためのデータベース","ネットワーク機器の設定を保存するデータベース","意思決定支援のために、複数の業務データを時系列に蓄積・統合したデータベース","個人情報だけを保管するデータベース"],
 e:"データウェアハウス（DWH）は、基幹系システムなどからデータを抽出・変換・蓄積し、分析や経営判断に使える形で統合したデータベースです。日々の更新処理に強い通常のDBと対比され、分析用に最適化されています。",
 pt:"DWH＝分析用に統合・時系列蓄積"},

{id:"T39",field:"technology",mid:"技術要素",sub:"ネットワーク",a:0,
 q:"TCP/IPの4階層モデルのうち、IPアドレスに基づく経路選択（ルーティング）を行うのはどの層か。",
 c:["インターネット層","アプリケーション層","トランスポート層","ネットワークインタフェース層"],
 e:"インターネット層（IP層）は、IPアドレスを使ってパケットの経路を決め、ネットワーク間でデータを届けます。トランスポート層はTCP/UDPで端末間の通信を制御し、アプリケーション層はHTTPやSMTPなどが該当します。",
 pt:"TCP/IP：アプリ→トランスポート→インターネット→IF"},

{id:"T40",field:"technology",mid:"技術要素",sub:"ネットワーク",a:1,
 q:"TCPとUDPの違いとして、最も適切なものはどれか。",
 c:["TCPは速度優先で再送を行わない","TCPは再送や順序制御で信頼性を確保し、UDPは高速だが信頼性を保証しない","UDPは必ずコネクションを確立してから通信する","TCPとUDPは同じプロトコルである"],
 e:"TCPはコネクションを確立し、確認応答・再送・順序制御によって信頼性の高い通信を実現します。UDPはこれらを行わない代わりに低遅延で、音声・動画のストリーミングやDNSなどに使われます。",
 pt:"TCP＝信頼性、UDP＝高速・軽量（再送なし）"},

{id:"T41",field:"technology",mid:"技術要素",sub:"ネットワーク",a:2,
 q:"IPv4のアドレス空間の不足を補うために、1つのグローバルIPアドレスを複数の端末で共有する技術はどれか。",
 c:["DHCP","DNS","NAPT（IPマスカレード）","VLAN"],
 e:"NAPT（IPマスカレード）は、プライベートIPアドレスとポート番号を変換し、1つのグローバルIPアドレスで複数端末の通信を実現します。DHCPはIPアドレスの自動割当て、DNSは名前解決、VLANは仮想的なLAN分割です。",
 pt:"NAPT＝IP＋ポート変換でグローバルIPを共有"},

{id:"T42",field:"technology",mid:"技術要素",sub:"ネットワーク",a:0,
 q:"IPアドレス 192.168.1.10、サブネットマスク 255.255.255.0 のとき、このアドレスが属するネットワークアドレスはどれか。",
 c:["192.168.1.0","192.168.0.0","192.168.1.255","192.168.255.0"],
 e:"サブネットマスク255.255.255.0は上位24ビットをネットワーク部とするため、下位8ビットを0にした192.168.1.0がネットワークアドレスです。192.168.1.255はブロードキャストアドレスになります。",
 pt:"ネットワークアドレス＝IPのホスト部を0にする"},

{id:"T43",field:"technology",mid:"技術要素",sub:"ネットワーク",a:1,
 q:"無線LANの規格のうち、5GHz帯を使い高速通信が可能なものはどれか。",
 c:["IEEE802.3","IEEE802.11ac","IEEE802.15.1","IEEE802.16"],
 e:"IEEE802.11ac（および11ax/11n）は無線LAN（Wi-Fi）の規格で、5GHz帯を使用します。IEEE802.3は有線LAN（Ethernet）、802.15.1はBluetooth、802.16はWiMAXです。",
 pt:"802.11＝無線LAN、802.3＝有線LAN"},

{id:"T44",field:"technology",mid:"技術要素",sub:"ネットワーク",a:2,
 q:"DNSの役割として、最も適切なものはどれか。",
 c:["メールの送受信を行う","Webページの内容を暗号化する","ドメイン名とIPアドレスを対応付ける","ネットワーク機器にIPアドレスを自動配布する"],
 e:"DNS（Domain Name System）は、www.example.comのようなドメイン名をIPアドレスに変換する（名前解決）仕組みです。3はDHCPの役割です。",
 pt:"DNS＝ドメイン名⇔IPアドレスの名前解決"},

{id:"T45",field:"technology",mid:"技術要素",sub:"セキュリティ",a:1,p:1,y:2024,
 q:"公開鍵暗号方式の説明として、最も適切なものはどれか。",
 c:["暗号化と復号に同じ鍵を使う","暗号化には受信者の公開鍵、復号には受信者の秘密鍵を使う","暗号化には送信者の秘密鍵、復号には送信者の公開鍵を使う","鍵を一切使わずに暗号化する"],
 e:"公開鍵暗号方式は、公開鍵で暗号化し、対になる秘密鍵で復号します。鍵の配送が不要という利点がある一方、処理速度が遅いため、共通鍵の配送（ハイブリッド暗号）に使われます。3はデジタル署名の仕組みです。",
 pt:"公開鍵で暗号化→秘密鍵で復号。署名はその逆"},

{id:"T46",field:"technology",mid:"技術要素",sub:"セキュリティ",a:3,
 q:"デジタル署名の目的として、最も適切なものはどれか。",
 c:["データを圧縮して容量を小さくする","データの内容を第三者に公開する","通信速度を向上させる","データの改ざんの検知と、作成者のなりすましの防止"],
 e:"デジタル署名は、送信者の秘密鍵でデータのハッシュ値を暗号化して添付します。受信者は送信者の公開鍵で検証し、改ざんがないこと（完全性）と、確かに本人が作成したこと（真正性・否認防止）を確認できます。",
 pt:"デジタル署名＝完全性＋真正性＋否認防止"},

{id:"T47",field:"technology",mid:"技術要素",sub:"セキュリティ",a:0,
 q:"SQLインジェクション攻撃の説明として、最も適切なものはどれか。",
 c:["入力フォームに不正なSQL文を埋め込み、データベースを不正に操作する","大量の通信でサービスを停止させる","パスワードを総当たりで試行する","Webサイトの閲覧者に偽の画面を表示させる"],
 e:"SQLインジェクションは、アプリケーションが入力をそのままSQL文に組み込んでいる隙を突き、DBの不正操作や情報漏えいを引き起こす攻撃です。対策はプレースホルダ（バインド機構）の使用と入力値の検証です。",
 pt:"SQLインジェクション対策＝プレースホルダ＋入力検証"},

{id:"T48",field:"technology",mid:"技術要素",sub:"セキュリティ",a:2,
 q:"クロスサイトスクリプティング（XSS）の説明として、最も適切なものはどれか。",
 c:["サーバに大量のリクエストを送りサービスを妨害する","通信を盗聴してパスワードを取得する","Webページに悪意のあるスクリプトを埋め込み、閲覧者のブラウザで実行させる","データベースの内容を書き換える"],
 e:"XSSは、掲示板やSNSなどの入力欄に悪意あるスクリプトを仕込み、それを閲覧した利用者のブラウザ上で実行させる攻撃です。Cookieの窃取や偽画面の表示に悪用されます。対策は出力時のエスケープ処理です。",
 pt:"XSS＝スクリプト埋込み。対策は出力エスケープ"},

{id:"T49",field:"technology",mid:"技術要素",sub:"セキュリティ",a:1,
 q:"ブルートフォース攻撃の説明として、最も適切なものはどれか。",
 c:["辞書にある単語を組み合わせてパスワードを推測する","考えられるすべての文字の組合せを総当たりで試す","通信内容を傍受して解析する","ウイルスに感染させて情報を送信させる"],
 e:"ブルートフォース（総当たり）攻撃は、パスワードの全パターンを機械的に試行します。1は辞書攻撃、3は盗聴（スニッフィング）です。対策はパスワードの長文化と、一定回数失敗でのアカウントロックです。",
 pt:"ブルートフォース＝総当たり、辞書攻撃＝辞書の単語"},

{id:"T50",field:"technology",mid:"技術要素",sub:"セキュリティ",a:2,
 q:"ランサムウェアの説明として、最も適切なものはどれか。",
 c:["感染しても表示が変わるだけで実害はない","自己増殖してネットワークを輻輳させる","ファイルを暗号化して使用不能にし、復号のための身代金を要求する","キー入力を記録してパスワードを窃取する"],
 e:"ランサムウェアは、端末のファイルを暗号化するなどして利用できなくし、元に戻すことと引き換えに金銭を要求するマルウェアです。対策はバックアップの確保、OS・ソフトの更新、添付ファイルの警戒です。",
 pt:"ランサムウェア＝暗号化＋身代金要求。対策はバックアップ"},

{id:"T51",field:"technology",mid:"技術要素",sub:"セキュリティ",a:0,
 q:"多要素認証の説明として、最も適切なものはどれか。",
 c:["知識・所持・生体のうち、異なる2つ以上の要素を組み合わせて本人確認する","同じパスワードを2回入力させる","パスワードを2つ設定する","2台の端末から同時にログインできるようにする"],
 e:"多要素認証は「知っているもの（パスワード）」「持っているもの（ICカード・スマホ）」「本人の特徴（指紋・顔）」という性質の異なる要素を2つ以上組み合わせます。同じ要素を2つ重ねても多要素にはなりません。",
 pt:"多要素＝知識・所持・生体のうち異なる2つ以上"},

{id:"T52",field:"technology",mid:"技術要素",sub:"セキュリティ",a:1,
 q:"ファイアウォールの説明として、最も適切なものはどれか。",
 c:["データを暗号化して保存する","通過する通信を検査し、許可されていない通信を遮断する","ウイルス定義ファイルを更新する","アクセスログを暗号化する"],
 e:"ファイアウォールは、ネットワークの境界でパケットの送信元・宛先・ポート番号などを見て、許可された通信だけを通す仕組みです。内部ネットワークを外部の不正アクセスから守ります。",
 pt:"ファイアウォール＝境界で通信を許可制御"},

{id:"T53",field:"technology",mid:"技術要素",sub:"セキュリティ",a:3,
 q:"WAF（Web Application Firewall）の説明として、最も適切なものはどれか。",
 c:["社内LANのIPアドレスを自動割当する","無線LANの電波を暗号化する","メールの添付ファイルを検査する","Webアプリケーションへの攻撃を検知・遮断する"],
 e:"WAFは、HTTP/HTTPSの通信内容を検査し、SQLインジェクションやXSSなどWebアプリ特有の攻撃を検知・遮断します。ファイアウォールがIP・ポート単位なのに対し、WAFはアプリケーション層の内容を見る点が異なります。",
 pt:"WAF＝Webアプリ層の攻撃対策"},

{id:"T54",field:"technology",mid:"技術要素",sub:"セキュリティ",a:2,
 q:"セキュリティバイデザインの考え方として、最も適切なものはどれか。",
 c:["システム完成後にセキュリティ診断を行う","事故が起きてから対策を検討する","企画・設計の初期段階からセキュリティを組み込む","セキュリティ対策は運用部門だけが担当する"],
 e:"セキュリティバイデザインは、システムの企画・設計段階からセキュリティを考慮して作り込む考え方です。後から対策を追加するより低コストで、脆弱性の作り込みを防げます。",
 pt:"セキュリティバイデザイン＝設計段階から対策を内蔵"},

{id:"T55",field:"technology",mid:"技術要素",sub:"セキュリティ",a:1,
 q:"共通鍵暗号方式の特徴として、最も適切なものはどれか。",
 c:["鍵の配送が不要である","暗号化と復号に同じ鍵を使うため、処理が高速である","公開鍵より鍵管理が容易である","必ずデジタル署名と組み合わせて使う"],
 e:"共通鍵暗号方式は、送信者と受信者が同じ鍵を共有し、処理が高速という利点があります。一方で、安全に鍵を配送する方法が課題となり、この課題を解決するために公開鍵暗号と組み合わせたハイブリッド方式が使われます。",
 pt:"共通鍵＝高速だが鍵配送が課題"},

{id:"T56",field:"technology",mid:"開発技術",sub:"開発技術（その他）",a:2,
 q:"APIの説明として、最も適切なものはどれか。",
 c:["アプリケーションの画面デザインを定義したもの","データベースの表構造を定義したもの","ソフトウェア同士が機能を呼び出し合うためのインタフェース","プログラムの実行速度を測定する指標"],
 e:"API（Application Programming Interface）は、あるソフトウェアの機能を別のプログラムから利用するための手順や仕様です。Web APIではHTTPを通じてデータをやり取りし、サービス連携に広く使われます。",
 pt:"API＝ソフトウェア間の機能呼び出しの窓口"},

{id:"T57",field:"technology",mid:"開発技術",sub:"開発技術（その他）",a:0,
 q:"OSSを利用する際のライセンス管理として、最も適切なものはどれか。",
 c:["利用するOSSのライセンス条件を確認し、ソース公開義務などの遵守事項を管理する","OSSはすべて自由に使えるため、ライセンス確認は不要である","OSSの利用は社内開発に限る","OSSの著作権表示は削除してよい"],
 e:"OSSはライセンスごとに条件が異なり、GPLのように派生物のソース公開を求めるものもあります。利用前にライセンスを確認し、義務の履行とライセンス一覧の管理（SBOMなど）が求められます。",
 pt:"OSSはライセンス確認が必須。GPLはコピーレフトに注意"}

{id:"K01",field:"strategy",sub:"経営組織",term:"事業部制組織",def:"製品・市場・地域などの単位で事業部を分け、各事業部に広い権限と利益責任を委譲する組織形態。",key:"権限委譲＋利益責任で意思決定が速い"},
{id:"K02",field:"strategy",sub:"経営組織",term:"カンパニー制",def:"社内を疑似独立企業のように分け、損益だけでなく資本効率（ROI）まで責任を負わせる制度。",key:"事業部制との違いは「資本効率」への責任"},
{id:"K03",field:"strategy",sub:"経営組織",term:"マトリックス組織",def:"職能別（縦）と製品・プロジェクト別（横）の命令系統を組み合わせた組織。",key:"二重の命令系統。専門性と目的達成の両立"},
{id:"K04",field:"strategy",sub:"会計・財務",term:"損益分岐点売上高",def:"利益がゼロになる売上高。固定費 ÷（1 − 変動費率）で求める。",key:"固定費 ÷ 限界利益率"},
{id:"K05",field:"strategy",sub:"会計・財務",term:"ROE / ROA",def:"ROEは当期純利益÷自己資本（株主視点）、ROAは当期純利益÷総資産（全資産の効率）。",key:"ROE＝自己資本、ROA＝総資産"},
{id:"K06",field:"strategy",sub:"会計・財務",term:"減価償却（定額法）",def:"取得価額から残存価額を引いた額を、耐用年数で均等に費用化する方法。",key:"(取得価額−残存価額)÷耐用年数"},
{id:"K07",field:"strategy",sub:"会計・財務",term:"貸借対照表（B/S）",def:"ある時点の財政状態を「資産＝負債＋純資産」で示す財務諸表。",key:"B/Sは「ある時点」、P/Lは「一定期間」"},
{id:"K08",field:"strategy",sub:"法務",term:"不正アクセス禁止法",def:"他人のID・パスワードを無断使用したログインや、識別符号の不正取得・提供を禁止する法律。",key:"なりすましログイン＋ID不正取得"},
{id:"K09",field:"strategy",sub:"法務",term:"要配慮個人情報",def:"人種・信条・社会的身分・病歴・犯罪歴など、差別や偏見が生じないよう配慮を要する個人情報。",key:"取得には原則として本人の同意が必要"},
{id:"K10",field:"strategy",sub:"法務",term:"著作権の保護対象",def:"プログラムも著作物として保護される。保護されるのは「表現」で、アイデアは対象外。期間は死後70年。",key:"プログラムも著作物。アイデアは保護されない"},
{id:"K11",field:"strategy",sub:"法務",term:"労働者派遣",def:"雇用主は派遣元、指揮命令権者は派遣先という二重の関係になる働き方。",key:"雇用＝派遣元、指揮命令＝派遣先"},
{id:"K12",field:"strategy",sub:"経営戦略手法",term:"SWOT分析",def:"強み・弱み（内部環境）と機会・脅威（外部環境）を組み合わせて戦略を導く手法。",key:"内部S・W × 外部O・T"},
{id:"K13",field:"strategy",sub:"経営戦略手法",term:"3C分析",def:"Customer（顧客・市場）、Competitor（競合）、Company（自社）の3視点で市場を分析。",key:"顧客・競合・自社"},
{id:"K14",field:"strategy",sub:"経営戦略手法",term:"PPM",def:"縦軸に市場成長率、横軸に市場占有率をとり、事業を花形・金のなる木・問題児・負け犬に分類。",key:"高成長高シェア＝花形、低成長高シェア＝金のなる木"},
{id:"K15",field:"strategy",sub:"経営戦略手法",term:"ファイブフォース分析",def:"新規参入・代替品・売り手・買い手・業者間競争の5要因で業界の魅力度を分析。",key:"5つの力で業界構造を見る"},
{id:"K16",field:"strategy",sub:"経営戦略手法",term:"バリューチェーン",def:"業務を主活動と支援活動に分解し、付加価値がどこで生まれているかを分析する手法。",key:"主活動＋支援活動の連鎖"},
{id:"K17",field:"strategy",sub:"経営戦略手法",term:"アンゾフの成長マトリクス",def:"製品（既存・新規）×市場（既存・新規）で市場浸透・製品開発・市場開拓・多角化に分類。",key:"両方新規＝多角化"},
{id:"K18",field:"strategy",sub:"マーケティング",term:"4P",def:"Product（製品）、Price（価格）、Place（流通）、Promotion（販促）のマーケティングミックス。",key:"4Pを顧客視点にすると4C"},
{id:"K19",field:"strategy",sub:"マーケティング",term:"RFM分析",def:"最終購買日（Recency）・購買頻度（Frequency）・購買金額（Monetary）で顧客を分類。",key:"最新性・頻度・金額"},
{id:"K20",field:"strategy",sub:"マーケティング",term:"カスタマージャーニーマップ",def:"認知から購買、購入後までの顧客体験を時系列で可視化した図。",key:"顧客体験を時間軸で描く"},
{id:"K21",field:"strategy",sub:"ビジネスシステム",term:"ERP",def:"会計・販売・購買・生産・在庫・人事などの基幹業務を一元管理し、全社最適を図るシステム。",key:"部分最適→全体最適"},
{id:"K22",field:"strategy",sub:"ビジネスシステム",term:"CRM / SFA",def:"CRMは顧客情報を一元管理して関係を強化。SFAは営業活動（商談・案件）を支援。",key:"CRM＝顧客、SFA＝営業"},
{id:"K23",field:"strategy",sub:"ビジネスシステム",term:"SCM",def:"調達・生産・在庫・物流・販売をまたぐ供給の流れ全体を最適化する考え方。",key:"サプライチェーン全体の最適化"},
{id:"K24",field:"strategy",sub:"ビジネスシステム",term:"POSシステム",def:"販売時点で商品・数量・時刻などの情報を収集し、在庫管理や発注に活用する仕組み。",key:"いつ・何が・いくつ売れたか"},
{id:"K25",field:"strategy",sub:"e-ビジネス",term:"ロングテール",def:"販売数の少ない多数の商品を豊富に揃え、合計で大きな売上を得る戦略。",key:"少数×多数の合算"},
{id:"K26",field:"strategy",sub:"e-ビジネス",term:"O2O",def:"オンラインの情報発信を起点に、実店舗への来店・購買を促す取組み。",key:"Online to Offline"},
{id:"K27",field:"strategy",sub:"技術開発戦略",term:"オープンイノベーション",def:"自前主義を脱し、外部の大学・企業・スタートアップの知識や技術を組み合わせて革新を起こす手法。",key:"外部知の活用"},

"use strict";

const KEY = "itp_notebook_v1";
const FIELDS = {
  strategy:   {name:"ストラテジ系", short:"ストラテジ", cls:"strategy",   desc:"経営・法務・システム戦略"},
  management: {name:"マネジメント系", short:"マネジメント", cls:"management", desc:"開発・プロジェクト・監査"},
  technology: {name:"テクノロジ系", short:"テクノロジ", cls:"technology", desc:"基礎理論・NW・セキュリティ"}
};
const FIELD_KEYS = ["strategy","management","technology"];
const WD = ["日","月","火","水","木","金","土"];

const DEFAULT_STATE = {
  v:1,
  settings:{
    examDate:"2026-11-12",
    weekdays:[2,4,6,0],      // 火・木・土・日
    minutesPerDay:60,
    targetRate:70,
    preferPast:true
  },
  history:[],
  roadmap:{},
  custom:[],
  edits:{},
  hidden:[],
  cardWeak:{},
  session:null,
  streak:{last:null, days:0},
  createdAt:null
};

/* ---------------- ユーティリティ ---------------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const pad2 = n=>String(n).padStart(2,"0");
const dayKey = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const startOfDay = d => new Date(d.getFullYear(),d.getMonth(),d.getDate());
const parseDay = s => { if(!s) return null; const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s); if(!m) return null; const d=new Date(+m[1],+m[2]-1,+m[3]); return isNaN(d)?null:d; };
const addDays = (d,n)=>{ const x=new Date(d.getTime()); x.setDate(x.getDate()+n); return startOfDay(x); };
const today = ()=>startOfDay(new Date());
const diffDays = (a,b)=>Math.round((startOfDay(b)-startOfDay(a))/86400000);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const pct = (a,b)=> b>0 ? Math.round(a/b*100) : 0;
const fmtTime = sec => `${pad2(Math.floor(sec/60))}:${pad2(Math.floor(sec%60))}`;
const shuffle = arr => { const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const uid = p => `${p}${Date.now().toString(36)}${Math.random().toString(36).slice(2,6)}`;
const jpDate = d => `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`;

/* ---------------- 状態 ---------------- */
let ST = null;

function deepFill(def, src){
  if(Array.isArray(def)) return Array.isArray(src)?src:def.slice();
  if(def && typeof def==="object"){
    const o={};
    Object.keys(def).forEach(k=>{ o[k] = (src && typeof src==="object" && k in src) ? deepFill(def[k], src[k]) : (Array.isArray(def[k])?def[k].slice():(def[k]&&typeof def[k]==="object"?deepFill(def[k],{}):def[k])); });
    if(src && typeof src==="object") Object.keys(src).forEach(k=>{ if(!(k in o)) o[k]=src[k]; });
    return o;
  }
  return src===undefined?def:src;
}
function loadState(){
  let raw=null;
  try{ raw = localStorage.getItem(KEY); }catch(e){ console.warn("localStorage利用不可",e); }
  if(!raw){ ST = deepFill(DEFAULT_STATE,{}); ST.createdAt = Date.now(); return; }
  try{
    const p = JSON.parse(raw);
    ST = deepFill(DEFAULT_STATE, p);
  }catch(e){ console.warn("保存データが壊れていたため初期化します", e); ST = deepFill(DEFAULT_STATE,{}); }
  if(!ST.createdAt) ST.createdAt = Date.now();
}
let saveTimer=null;
function save(now){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; }
  const doSave=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(ST)); }catch(e){ console.warn("保存に失敗",e); toast("保存に失敗しました（容量不足の可能性）"); } };
  if(now) doSave(); else saveTimer=setTimeout(doSave,250);
}

/* ---------------- 問題バンク ---------------- */
function baseQuestions(){
  return [].concat(window.Q_STRATEGY||[], window.Q_MANAGEMENT||[], window.Q_TECHNOLOGY||[]);
}
function allQuestions(){
  const hidden = new Set(ST.hidden||[]);
  const out = [];
  baseQuestions().forEach(q=>{
    if(hidden.has(q.id)) return;
    const ed = ST.edits[q.id];
    out.push(ed ? Object.assign({}, q, ed, {id:q.id, field:ed.field||q.field, mid:ed.mid||q.mid, sub:ed.sub||q.sub, _edited:true}) : q);
  });
  (ST.custom||[]).forEach(q=>{ if(!hidden.has(q.id)) out.push(q); });
  return out;
}
function qById(id){ return allQuestions().find(q=>q.id===id) || baseQuestions().find(q=>q.id===id) || null; }
function fieldOf(q){ return FIELDS[q.field]?q.field:"technology"; }
function labelOf(q){ return `${FIELDS[fieldOf(q)].short} / ${q.mid||"-"} / ${q.sub||"-"}`; }

/* ---------------- 集計 ---------------- */
function allAttempts(){
  const arr=[];
  (ST.history||[]).forEach(h=>{ (h.answers||[]).forEach(a=>{ arr.push(Object.assign({ts:h.ts, mode:h.mode}, a)); }); });
  return arr;
}
function accuracyByField(){
  const res={};
  FIELD_KEYS.forEach(f=>res[f]={t:0,c:0,rate:null});
  allAttempts().forEach(a=>{
    const q=qById(a.qid); if(!q) return;
    const f=fieldOf(q); res[f].t++; if(a.ok) res[f].c++;
  });
  FIELD_KEYS.forEach(f=>{ res[f].rate = res[f].t>0 ? Math.round(res[f].c/res[f].t*100) : null; });
  return res;
}
function accuracyByGroup(level){ // level: "mid" | "sub"
  const map={};
  allAttempts().forEach(a=>{
    const q=qById(a.qid); if(!q) return;
    const f=fieldOf(q);
    const key = (level==="sub") ? `${f}|${q.mid||"その他"}|${q.sub||"その他"}` : `${f}|${q.mid||"その他"}`;
    if(!map[key]) map[key]={field:f, mid:q.mid||"その他", sub:q.sub||"", t:0,c:0};
    map[key].t++; if(a.ok) map[key].c++;
  });
  return Object.values(map).map(o=>Object.assign(o,{rate: o.t?Math.round(o.c/o.t*100):0})).sort((a,b)=>a.rate-b.rate||b.t-a.t);
}
function weakQuestions(){
  const last={};
  allAttempts().sort((a,b)=>a.ts-b.ts).forEach(a=>{ last[a.qid]={ok:a.ok, ts:a.ts}; });
  return Object.keys(last).filter(k=>!last[k].ok).sort((a,b)=>last[b].ts-last[a].ts);
}
function overallStats(){
  const at=allAttempts();
  const c=at.filter(a=>a.ok).length;
  return { total:at.length, correct:c, rate: at.length?Math.round(c/at.length*100):null,
           sessions:(ST.history||[]).length,
           studyDays: new Set((ST.history||[]).map(h=>dayKey(new Date(h.ts)))).size };
}
function streakInfo(){
  const days = new Set((ST.history||[]).map(h=>dayKey(new Date(h.ts))));
  let n=0, cur=today();
  if(!days.has(dayKey(cur))) cur=addDays(cur,-1);
  while(days.has(dayKey(cur))){ n++; cur=addDays(cur,-1); }
  return n;
}

/* ---------------- 学習ロードマップの計画生成 ---------------- */
function buildPlan(){
  const exam = parseDay(ST.settings.examDate);
  const t = today();
  if(!exam) return {exam:null, days:[], studyDates:[], total:0, n:0, weights:{}};
  const total = Math.max(0, diffDays(t, exam));
  const wd = (ST.settings.weekdays && ST.settings.weekdays.length) ? ST.settings.weekdays : [2,4,6,0];
  const acc = accuracyByField();
  const target = ST.settings.targetRate || 70;
  const weights = {};
  FIELD_KEYS.forEach(f=>{
    const r = acc[f].rate;
    weights[f] = r===null ? 1.7 : 1 + Math.max(0, target-r)/35;
  });
  const studyDates = [];
  for(let i=0;i<total;i++){ const d=addDays(t,i); if(wd.includes(d.getDay())) studyDates.push(d); }
  const n = studyDates.length;
  // 最大剰余法で「苦手分野ほど多く」なるよう配分を決める
  const counts = {strategy:0,management:0,technology:0};
  const totalW = FIELD_KEYS.reduce((s,f)=>s+weights[f],0);
  const quotas = FIELD_KEYS.map(f=>({f, q: totalW>0 ? weights[f]/totalW*n : n/FIELD_KEYS.length}));
  let assigned = 0;
  quotas.forEach(o=>{ counts[o.f] = Math.floor(o.q); assigned += counts[o.f]; });
  const remainders = quotas.slice().sort((a,b)=>(b.q-Math.floor(b.q))-(a.q-Math.floor(a.q)));
  for(let i=0; assigned<n && i<remainders.length*2; i++){
    const o = remainders[i % remainders.length];
    counts[o.f]++; assigned++;
  }
  // 同じ分野が連続しないよう、残数の多い分野から順に並べる
  const left = Object.assign({}, counts);
  const seq = [];
  let prev = null;
  for(let i=0;i<n;i++){
    const cands = FIELD_KEYS.filter(f=>left[f]>0);
    if(!cands.length) break;
    cands.sort((a,b)=> (left[b]-left[a]) || (a===prev?1:-1) - (b===prev?1:-1));
    let pick = cands.find(f=>f!==prev) || cands[0];
    seq.push(pick); left[pick]--; prev = pick;
  }
  while(seq.length<n) seq.push(FIELD_KEYS[0]);
  const mockIdx = new Set();
  if(n>=6){ mockIdx.add(Math.round(n*0.4)); mockIdx.add(Math.round(n*0.75)); }
  const weakN = weakQuestions().length;
  const minutes = ST.settings.minutesPerDay || 60;
  const days = studyDates.map((d,i)=>{
    let type="drill", field=seq[i];
    if(i===n-1){ type="final"; field=null; }
    else if(i===n-2){ type="term"; field=null; }
    else if(mockIdx.has(i)){ type="mock"; field=null; }
    else if(i%3===2 && weakN>=8){ type="review"; field=null; }
    let title="", detail="", mins=minutes;
    if(type==="drill"){
      title = `${FIELDS[field].short}系 10問演習`;
      detail = `問題演習で「${FIELDS[field].name}」を10問。間違えた問題は解説をその場で読み、用語カードを5枚。`;
    } else if(type==="review"){
      title = "弱点復習（誤答ノート）";
      detail = `間違えた問題だけを復習モードで解き直す。今の誤答は${weakN}問。`;
    } else if(type==="mock"){
      title = "模擬試験 60問（時間を計る）";
      detail = "本番と同じ4択・60問を制限時間60分で。結果画面で分野別の弱点を確認する。";
      mins = 60;
    } else if(type==="term"){
      title = "用語カード総復習";
      detail = "用語カードを全分野から20枚。説明できない用語に「苦手」を付けて、直前にもう一度見る。";
    } else {
      title = "総仕上げ：誤答を全問やり直す";
      detail = "復習モードで誤答ノートを空にする。正答率80%以上なら本番は十分戦える。";
    }
    return {date:d, key:dayKey(d), type, field, title, detail, mins, done: !!ST.roadmap[dayKey(d)]};
  });
  return {exam, days, studyDates, total, n, weights, counts};
}

      解説を読んだら、関連する用語カードをめくると定着しやすくなります。

/* ---------------- セッション開始 ---------------- */
function pickQuestions(opts){
  const {mode="practice", field="all", count=10, pastOnly=false} = opts||{};
  let pool;
  if(mode==="review"){
    const ids = weakQuestions();
    pool = ids.map(id=>qById(id)).filter(Boolean);
    if(!pool.length) return null;
    return shuffle(pool).slice(0, Math.min(count||pool.length, pool.length));
  }
  pool = allQuestions();
  if(field!=="all") pool = pool.filter(q=>fieldOf(q)===field);
  if(pastOnly) pool = pool.filter(q=>q.p);
  if(!pool.length) return null;
  if(mode==="exam"){
    // 分野のバランスを取って60問
    const per = Math.ceil(count/3);
    let picked=[];
    FIELD_KEYS.forEach(f=>{
      const fp = shuffle(allQuestions().filter(q=>fieldOf(q)===f));
      picked = picked.concat(fp.slice(0,per));
    });
    if(picked.length<count){
      const rest = shuffle(allQuestions().filter(q=>!picked.includes(q)));
      picked = picked.concat(rest.slice(0, count-picked.length));
    }
    return shuffle(picked).slice(0,count);
  }
  const n = Math.min(count, pool.length);
  return shuffle(pool).slice(0,n);
}

function startSession(opts){
  const qs = pickQuestions(opts);
  if(!qs || !qs.length){ toast("条件に合う問題がありません"); return; }
  ST.session = {
    id: uid("s"),
    mode: opts.mode||"practice",
    field: opts.field||"all",
    count: qs.length,
    qids: qs.map(q=>q.id),
    idx: 0,
    answers: new Array(qs.length).fill(null),
    startTs: Date.now(),
    limitSec: opts.mode==="exam" ? (opts.limitSec||3600) : null,
    endsAt: opts.mode==="exam" ? Date.now()+(opts.limitSec||3600)*1000 : null
  };
  save(true);
  navigate("quiz");
}
