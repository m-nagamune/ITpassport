/* ---------------- 出題 ---------------- */
let timerHandle = null;
VIEWS.quiz = function(){
  const s = ST.session;
  if(!s){ navigate("practice"); return {html:""}; }
  const qi = Math.min(s.idx, s.qids.length-1);
  const q = qById(s.qids[qi]);
  if(!q){ ST.session=null; save(true); navigate("practice"); return {html:""}; }
  const ans = s.answers[qi];
  const isExam = s.mode==="exam";
  const answered = !!ans && (ans.locked || isExam===false);
  const locked = !!(ans && ans.locked);
  const total = s.qids.length;

  const track = s.qids.map((_,i)=>{
    const a = s.answers[i];
    let cls = "";
    if(a && (a.locked || (a.ok!==undefined && !isExam))) cls = a.ok? "ok":"ng";
    else if(i===qi) cls="now";
    return `<i class="${cls}"></i>`;
  }).join("");

  const choices = q.c.map((txt,i)=>{
    let cls="";
    if(ans && ans.pick===i) cls+=" sel";
    if(locked){ if(i===q.a) cls=" correct"; else if(ans.pick===i) cls=" wrong"; }
    const mk = locked ? (i===q.a? '<span class="mk">正解</span>' : (ans.pick===i? '<span class="mk">あなたの解答</span>':"")) : "";
    return `<li><button class="choice${cls}" data-act="choose" data-i="${i}" ${locked||(isExam&&false)?"disabled":""}>
      <span class="k">${CHOICE_MARKS[i]}</span><span>${esc(txt)}</span>${mk}</button></li>`;
  }).join("");

  const explain = locked ? `
    <div class="explain">
      <div class="ex-head">
        <span class="res ${ans.ok?"":"wrong"}" style="color:${ans.ok?"#2f6b3a":"#9c4526"}">${ans.ok? "○ 正解":"× 不正解"}</span>
        <span class="muted small">正解は「${CHOICE_MARKS[q.a]}」</span>
      </div>
      <p>${esc(q.e||"")}</p>
      ${q.pt?`<div class="point"><b>暗記：</b>${esc(q.pt)}</div>`:""}
    </div>` : "";

  const isLast = qi===total-1;
  const footer = locked ? `
      <div class="quiz-foot">
        <span class="kbd-hint">キー操作：A〜D で解答 ／ Enter で次へ</span>
        <span class="spacer"></span>
        ${qi>0? `<button class="btn" data-act="prev-q">← 前の問題</button>`:""}
        <button class="btn btn-primary" data-act="next-q">${isLast? "結果を見る":"次の問題 →"}</button>
      </div>` : (isExam ? `
      <div class="quiz-foot">
        <span class="kbd-hint">解答を選んで「次へ」。あとで戻って変更できます。</span>
        <span class="spacer"></span>
        ${qi>0? `<button class="btn" data-act="prev-q">← 前へ</button>`:""}
        ${isLast? `<button class="btn btn-vermilion" data-act="finish-exam">採点する</button>`
                 : `<button class="btn btn-primary" data-act="next-q">次へ →</button>`}
      </div>` : `<div class="quiz-foot"><span class="kbd-hint">選択肢をタップすると解答します</span></div>`);

  const timerHTML = isExam ? `<span class="timer" id="quiz-timer">--:--</span>` : "";

  return {html:`
    <div class="quiz-top">
      <span class="pill">${isExam?"模擬試験":(s.mode==="review"?"復習モード":"通常演習")}</span>
      <div class="progress-track">${track}</div>
      <span class="quiz-meta"><b>${qi+1}</b> / ${total}</span>
      ${timerHTML}
    </div>
    <article class="q-card">
      <div class="q-head">
        ${pillField(fieldOf(q))}
        <span class="pill">${esc(q.mid||"")}</span>
        <span class="pill">${esc(q.sub||"")}</span>
        ${q.p?`<span class="pill past">過去問ベース${q.y?` ${q.y}年度`:""}</span>`:""}
      </div>
      <p class="q-text">${esc(q.q)}</p>
      <ul class="choices">${choices}</ul>
      ${explain}
      ${footer}
    </article>
    <div class="flex" style="justify-content:space-between;margin-top:14px">
      <button class="btn btn-sm btn-ghost" data-act="pause-quiz">中断して保存</button>
      <span class="small muted">${s.mode==="review"?"誤答ノートから出題中":""}</span>
    </div>
  `, after(){
    if(isExam) startTimer();
  }};
};

function startTimer(){
  stopTimer();
  updateTimer();
  timerHandle = setInterval(updateTimer, 1000);
}
function stopTimer(){ if(timerHandle){ clearInterval(timerHandle); timerHandle=null; } }
function updateTimer(){
  const s=ST.session;
  if(!s||!s.endsAt){ stopTimer(); return; }
  const left = Math.max(0, Math.round((s.endsAt - Date.now())/1000));
  const el = $("#quiz-timer");
  if(el){ el.textContent = fmtTime(left); el.classList.toggle("warn", left<=300); }
  if(left<=0){ stopTimer(); toast("制限時間になりました。採点します"); finishSession(true); }
}

function applyChoice(pick){
  const s=ST.session; if(!s) return;
  const q=qById(s.qids[s.idx]); if(!q) return;
  const cur = s.answers[s.idx];
  if(cur && cur.locked) return;
  const ok = pick===q.a;
  s.answers[s.idx] = {qid:q.id, pick, ok, ts:Date.now()};
  if(s.mode!=="exam") s.answers[s.idx].locked = true;
  save();
  render();
  if(s.mode!=="exam"){ setTimeout(()=>{ const b=$(".q-card .explain"); if(b) b.scrollIntoView({block:"nearest",behavior:"smooth"}); },60); }
}

act("choose", (el)=>{ applyChoice(+el.dataset.i); });

act("next-q", ()=>{
  const s=ST.session; if(!s) return;
  if(s.answers[s.idx]===null){ toast("選択肢を選んでください"); return; }
  if(s.idx < s.qids.length-1){ s.idx++; save(true); render(); }
  else if(s.mode==="exam"){ confirmFinish(); }
  else { finishSession(false); }
});
act("prev-q", ()=>{ const s=ST.session; if(!s||s.idx===0) return; s.idx--; save(true); render(); });
act("finish-exam", ()=>confirmFinish());
function confirmFinish(){
  const s=ST.session; if(!s) return;
  const un = s.answers.filter(a=>!a).length;
  openModal(`<h3 id="modal-title">採点しますか？</h3>
    <p class="m-sub">${un? `未解答が ${un}問あります。`:"すべて解答済みです。"}採点するとこのセッションは終了します。</p>
    <div class="modal-foot"><button class="btn" data-act="close-modal">戻る</button>
    <button class="btn btn-vermilion" data-act="do-finish">採点する</button></div>`);
}
act("do-finish", ()=>{ closeModal(); finishSession(false); });
act("pause-quiz", ()=>{ save(true); stopTimer(); toast("保存しました。ホームから再開できます"); navigate("home"); });

function finishSession(timeup){
  const s=ST.session; if(!s) return;
  stopTimer();
  const answers = s.qids.map((qid,i)=>{
    const a = s.answers[i] || {qid, pick:null, ok:false, ts:Date.now()};
    return {qid, pick:a.pick, ok:!!a.ok, ts:a.ts||Date.now()};
  });
  const correct = answers.filter(a=>a.ok).length;
  const rec = {
    id: s.id, ts: Date.now(), mode: s.mode, field: s.field,
    count: answers.length, correct,
    rate: Math.round(correct/answers.length*100),
    sec: Math.round((Date.now()-s.startTs)/1000),
    timeup: !!timeup,
    answers
  };
  ST.history = ST.history || [];
  ST.history.push(rec);
  if(ST.history.length>300) ST.history = ST.history.slice(-300);
  // ストリーク更新
  const todayK = dayKey(today());
  if(ST.streak.last !== todayK){
    const y = dayKey(addDays(today(),-1));
    ST.streak.days = (ST.streak.last===y)? (ST.streak.days||0)+1 : 1;
    ST.streak.last = todayK;
  }
  ST.session = null;
  save(true);
  navigate("result/"+rec.id);
}

VIEWS.result = function(param){
  const rec = (ST.history||[]).slice().reverse().find(h=>h.id===param) || (ST.history||[]).slice(-1)[0];
  if(!rec) return {html:`<div class="empty"><span class="em-ico">📄</span>結果がありません</div>`};
  const byField = {};
  FIELD_KEYS.forEach(f=>byField[f]={t:0,c:0});
  const bySub = {};
  rec.answers.forEach(a=>{
    const q=qById(a.qid); if(!q) return;
    const f=fieldOf(q);
    byField[f].t++; if(a.ok) byField[f].c++;
    const k=`${f}|${q.mid||"その他"}|${q.sub||"その他"}`;
    if(!bySub[k]) bySub[k]={field:f,mid:q.mid,sub:q.sub,t:0,c:0};
    bySub[k].t++; if(a.ok) bySub[k].c++;
  });
  const subs = Object.values(bySub).map(o=>Object.assign(o,{rate:Math.round(o.c/o.t*100)})).sort((a,b)=>a.rate-b.rate||b.t-a.t);
  const weakSubs = subs.filter(o=>o.rate<70);
  const pass = rec.rate>=70;
  const wrongIds = rec.answers.filter(a=>!a.ok).map(a=>a.qid);
  const modeName = rec.mode==="exam"?"模擬試験":(rec.mode==="review"?"復習モード":"通常演習");
  const verdict = rec.mode==="exam"
      ? (rec.rate>=70? "合格ライン到達（目安）" : rec.rate>=60? "あと一歩。弱点を補強しましょう":"基礎の積み直しが必要です")
      : (rec.rate>=80? "よくできました" : rec.rate>=60? "あと少しで定着します":"解説を読んで復習しましょう");

  return {html:`
    <div class="page-head">
      <div><div class="eyebrow">Result</div><h1>結果</h1></div>
      <div class="spacer"></div>
      <span class="pill">${new Date(rec.ts).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}</span>
    </div>

    <section class="card">
      <div class="score-panel">
        ${ringSVG(rec.rate)}
        <div style="flex:1;min-width:200px">
          <div class="result-verdict ${pass?"pass":(rec.rate>=60?"near":"fail")}">${verdict}</div>
          <div class="small muted mb8">${modeName} ・ ${rec.count}問 ・ 正解 ${rec.correct}問 ・ 所要 ${fmtTime(rec.sec)}${rec.timeup?"（時間切れ）":""}</div>
          <div class="flex">
            ${wrongIds.length? `<button class="btn btn-primary btn-sm" data-act="retry-wrong" data-ids="${wrongIds.join(",")}">間違えた${wrongIds.length}問を解き直す</button>`:""}
            <button class="btn btn-sm" data-act="start-quick" data-field="all" data-count="10">もう一度10問</button>
            <a class="btn btn-sm" href="#/analysis">分析を見る</a>
          </div>
        </div>
      </div>
    </section>

    <div class="grid-2" style="margin-top:16px">
      <section class="card">
        <div class="card-title">分野別</div>
        <div class="field-rows">
          ${FIELD_KEYS.map(f=>{
            const b=byField[f]; if(!b.t) return `<div class="field-row"><span class="fname"><i class="dot ${f}"></i>${FIELDS[f].short}</span>${barHTML(null,f)}<span class="fval muted">—</span></div>`;
            const r=Math.round(b.c/b.t*100);
            return `<div class="field-row"><span class="fname"><i class="dot ${f}"></i>${FIELDS[f].short}</span>${barHTML(r,f)}<span class="fval"><b>${r}%</b> <span class="small">${b.c}/${b.t}</span></span></div>`;
          }).join("")}
        </div>
      </section>
      <section class="card">
        <div class="card-title">弱点の小分類<span class="ct-sub">正答率70%未満</span></div>
        ${weakSubs.length? `<div class="subcat-list">
          ${weakSubs.map(o=>`<div class="subcat">
            <span class="sc-name"><i class="dot ${o.field}"></i><span>${esc(o.sub||o.mid)}</span></span>
            <span class="sc-num">${o.c}/${o.t} ・ ${o.rate}%</span>
            ${barHTML(o.rate,o.field,true)}
          </div>`).join("")}
        </div>`: `<div class="empty" style="padding:22px"><span class="em-ico">◎</span>このセッションに弱点はありません</div>`}
      </section>
    </div>

    <section class="card" style="margin-top:16px">
      <div class="card-title">解答一覧<span class="ct-sub">タップで解説を開く</span></div>
      <div id="result-list">

/* ---- SVGチャート ---- */
function lineChart(points, opts={}){
  const W=620, H=250, pl=42, pr=14, pt=16, pb=34;
  const iw=W-pl-pr, ih=H-pt-pb;
  if(!points.length) return `<div class="empty"><span class="em-ico">📈</span>データがまだありません</div>`;
  const n=points.length;
  const x = i => n===1? pl+iw/2 : pl + iw*(i/(n-1));
  const y = v => pt + ih*(1-clamp(v,0,100)/100);
  const grid = [0,25,50,75,100].map(v=>`
    <line x1="${pl}" y1="${y(v)}" x2="${W-pr}" y2="${y(v)}" stroke="#e6dfcd" stroke-width="1" ${v===0?"":'stroke-dasharray="3 4"'}/>
    <text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#9c9384">${v}</text>`).join("");
  const target = opts.target? `<line x1="${pl}" y1="${y(opts.target)}" x2="${W-pr}" y2="${y(opts.target)}" stroke="#c9a227" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="${W-pr-2}" y="${y(opts.target)-5}" text-anchor="end" font-size="10" fill="#a8871f">目標 ${opts.target}%</text>`:"";
  const path = points.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  const area = `${path} L${x(n-1).toFixed(1)},${y(0)} L${x(0).toFixed(1)},${y(0)} Z`;
  const dots = points.map((p,i)=>{
    const col = p.v>=70? "#2f6b3a" : p.v>=50? "#a9682b":"#b5532f";
    return `<circle cx="${x(i)}" cy="${y(p.v)}" r="4" fill="#fff" stroke="${col}" stroke-width="2.4"><title>${esc(p.lab)}：${p.v}%</title></circle>`;
  }).join("");
  const step = Math.max(1, Math.ceil(n/7));
  const labels = points.map((p,i)=> (i%step===0||i===n-1)? `<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="9.5" fill="#9c9384">${esc(p.short||p.lab)}</text>`:"").join("");
  return `<div class="chart-box"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="正答率の推移">
    <defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f6f6b" stop-opacity=".22"/><stop offset="100%" stop-color="#2f6f6b" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}${target}
    <path d="${area}" fill="url(#lg1)"/>
    <path d="${path}" fill="none" stroke="#2f6f6b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${labels}
  </svg></div>`;
}
function hbarChart(rows){
  if(!rows.length) return `<div class="empty"><span class="em-ico">📊</span>データがまだありません</div>`;
  const max = Math.max.apply(null, rows.map(r=>r.v).concat([1]));
  return `<div style="display:flex;flex-direction:column;gap:7px">${rows.map(r=>`
    <div style="display:grid;grid-template-columns:120px 1fr 52px;gap:8px;align-items:center;font-size:11.5px">
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-soft)" title="${esc(r.k)}">${esc(r.k)}</span>
      <span style="height:11px;background:var(--paper-3);border-radius:6px;overflow:hidden;display:block">
        <i style="display:block;height:100%;width:${(r.v/max*100).toFixed(1)}%;background:${r.col||"var(--accent)"};border-radius:6px;transition:width .6s"></i>
      </span>
      <span style="text-align:right;font-variant-numeric:tabular-nums">${r.v}%${r.n?`<span class="muted" style="font-size:9.5px"> ${r.n}</span>`:""}</span>
    </div>`).join("")}</div>`;
}

        ${["practice","review","exam"].map(m=>{
          const hs = hist.filter(h=>h.mode===m);

/* ---------------- ロードマップ ---------------- */
VIEWS.roadmap = function(){
  const plan = buildPlan();
  const acc = accuracyByField();
  const target = ST.settings.targetRate;
  const doneN = plan.days.filter(d=>d.done).length;
  const todayK = dayKey(today());

  if(!plan.exam){
    return {html:`
      <div class="page-head"><div><div class="eyebrow">Roadmap</div><h1>学習ロードマップ</h1></div></div>
      <div class="card">
        <div class="empty" style="border:none;background:none">
          <span class="em-ico">🗓️</span>
          受験日が設定されていません。
          <div class="mt16"><button class="btn btn-primary" data-act="open-settings">受験日を設定する</button></div>
        </div>
      </div>`};
  }

  // 週ごとにまとめる
  const weeks = [];
  plan.days.forEach((d,i)=>{
    const wi = Math.floor(diffDays(today(), d.date)/7);
    let w = weeks.find(x=>x.i===wi);
    if(!w){ w={i:wi, days:[]}; weeks.push(w); }
    w.days.push(d);
  });

  const weightRows = FIELD_KEYS.map(f=>{
    const r = acc[f].rate;
    const w = plan.weights[f];
    const cnt = plan.counts[f];
    return `<div class="field-row">
      <span class="fname"><i class="dot ${f}"></i>${FIELDS[f].short}</span>
      ${barHTML(r, f)}
      <span class="fval">${r===null?'<b>—</b>':`<b>${r}%</b>`} <span class="small">配分${cnt}回</span></span>
    </div>`;
  }).join("");

  return {html:`
    <div class="page-head">
      <div><div class="eyebrow">Roadmap</div><h1>学習ロードマップ</h1></div>
      <div class="spacer"></div>
      <button class="btn btn-sm" data-act="open-settings">条件を変更</button>
    </div>

    <section class="card">
      <div class="between">
        <div>
          <div class="small muted">受験日</div>
          <div style="font-family:var(--serif);font-size:20px">${plan.exam.getFullYear()}/${plan.exam.getMonth()+1}/${plan.exam.getDate()}（${WD[plan.exam.getDay()]}）</div>
        </div>
        <div class="right">
          <div class="small muted">残り</div>
          <div style="font-family:var(--serif);font-size:20px;color:var(--vermilion)">${Math.max(0,diffDays(today(),plan.exam))}日</div>
        </div>
        <div class="right">
          <div class="small muted">学習日</div>
          <div style="font-family:var(--serif);font-size:20px">${doneN} / ${plan.n}日</div>
        </div>
      </div>
      <div class="mt16">${barHTML(plan.n? Math.round(doneN/plan.n*100):0)}</div>
      <div class="small muted mt8">1日 ${ST.settings.minutesPerDay}分 × 週${(ST.settings.weekdays||[]).length}日（${(ST.settings.weekdays||[]).map(w=>WD[w]).join("・")}）。チェックすると進捗に反映されます。</div>
    </section>

    <section class="card">
      <div class="card-title">分野の配分<span class="ct-sub">正答率が低い分野ほど多く出題</span></div>
      <div class="field-rows">${weightRows}</div>
      <div class="note-box mt16" style="margin-bottom:0">
        <b>計画の考え方：</b>正答率が目標（${target}%）に届いていない分野ほど配分を増やし、演習の進み具合に合わせて毎回組み直しています。
        苦手分野が伸びてくると、自然に他分野へ配分が移ります。
      </div>
    </section>

    <div class="mt24">
      ${weeks.map(w=>`
        <div class="rm-week">
          <div class="rm-week-head">
            <span class="wk-tag">${w.i===0?"今週":`第${w.i+1}週`}</span>
            <h4>${jpDate(w.days[0].date)} 〜 ${jpDate(w.days[w.days.length-1].date)}</h4>
            <span class="wk-line"></span>
            <span class="small muted">${w.days.filter(d=>d.done).length}/${w.days.length}日</span>
          </div>
          <div class="rm-days">
            ${w.days.map(d=>{
              const isToday = d.key===todayK;
              const missed = !d.done && d.date < today();
              return `<div class="rm-day ${isToday?"is-today":""} ${missed?"past-miss":""}">
                <div class="rm-date">
                  <span class="d">${d.date.getDate()}</span>
                  <span class="m">${d.date.getMonth()+1}月</span>
                  <span class="w">${WD[d.date.getDay()]}${isToday?"・今日":""}</span>
                </div>
                <div class="rm-body">
                  <div class="t">${esc(d.title)}
                    ${d.field?pillField(d.field):""}
                    ${missed?`<span class="pill ng">未完了</span>`:""}</div>
                  <div class="d2">${esc(d.detail)} ・ ${d.mins}分</div>
                </div>
                <div class="flex" style="gap:6px">
                  <button class="btn btn-sm" data-act="go-plan" data-type="${d.type}" data-field="${d.field||""}">開始</button>
                  <button class="rm-chk ${d.done?"on":""}" data-act="toggle-plan" data-key="${d.key}" aria-label="完了にする">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                  </button>
                </div>
              </div>`;
            }).join("")}
          </div>
        </div>`).join("")}
      ${plan.n===0? `<div class="empty"><span class="em-ico">🗓️</span>学習日がありません。受験日や学習曜日を見直してください。</div>`:""}
    </div>

    <div class="btn-row mt24">
      <button class="btn" data-act="reset-plan">チェックをすべて外す</button>
    </div>
  `, after(){}};
};

act("toggle-plan", (el)=>{

  save(true);

  if(ST.roadmap[k]) toast("完了にしました");
});

  openModal(`<h3 id="modal-title">チェックをすべて外しますか？</h3>
    <p class="m-sub">ロードマップの完了チェックだけをリセットします。学習履歴は残ります。</p>
    <div class="modal-foot"><button class="btn" data-act="close-modal">やめる</button>
      <button class="btn btn-vermilion" data-act="do-reset-plan">リセット</button></div>`);
});
act("do-reset-plan", ()=>{ ST.roadmap={}; save(true); closeModal(); toast("リセットしました"); render(); });

/* ---------------- 用語カード ---------------- */
let cardState = {field:"all", idx:0, flipped:false, order:null, weakOnly:false};

function cardList(){
  let list = (window.TERMS||[]).slice();
  if(cardState.field!=="all") list = list.filter(t=>t.field===cardState.field);
  if(cardState.weakOnly) list = list.filter(t=>ST.cardWeak[t.id]);
  if(!cardState.order || cardState.order.length!==list.length){
    cardState.order = list.map(t=>t.id);
  }
  return cardState.order.map(id=>list.find(t=>t.id===id)).filter(Boolean);
}

VIEWS.cards = function(){
  const list = cardList();
  const total = (window.TERMS||[]).length;
  const weakN = Object.keys(ST.cardWeak||{}).length;
  const idx = clamp(cardState.idx, 0, Math.max(0,list.length-1));
  cardState.idx = idx;
  const c = list[idx];
  const weak = c && ST.cardWeak[c.id];

  return {html:`
    <div class="page-head">
      <div><div class="eyebrow">Flashcards</div><h1>用語カード</h1></div>
      <div class="spacer"></div>
      <span class="pill">${total}枚</span>
    </div>

    <section class="card tight">
      <div class="between">
        <div class="chip-row">
          <button class="chip ${cardState.field==="all"?"on":""}" data-act="card-field" data-field="all">全分野</button>
          ${FIELD_KEYS.map(f=>`<button class="chip ${cardState.field===f?"on "+f[0]+"-on":""}" data-act="card-field" data-field="${f}">${FIELDS[f].short}</button>`).join("")}
        </div>
        <div class="flex">
          <button class="chip ${cardState.weakOnly?"on":""}" data-act="card-weak-only">苦手のみ ${weakN?`(${weakN})`:""}</button>
          <button class="btn btn-sm" data-act="card-shuffle">シャッフル</button>
        </div>
      </div>

    ${c? `
    <div class="mt16 fc-stage">
      <div class="fc ${cardState.flipped?"flip":""}" data-act="card-flip" role="button" tabindex="0" aria-label="カードをめくる">
        <div class="fc-face">
          <span class="fc-tag">${FIELDS[c.field].short} ／ ${esc(c.sub||"")}</span>
          <div class="fc-term">${esc(c.term)}</div>
          <div class="fc-hint">タップして答えを見る</div>
        </div>
        <div class="fc-face back">
          <span class="fc-tag">${esc(c.term)}</span>
          <div class="fc-def">${esc(c.def)}</div>
          ${c.key? `<div class="fc-key"><b>ひと言：</b>${esc(c.key)}</div>`:""}
          <div class="fc-hint">タップして用語に戻る</div>
        </div>
      </div>
      <div class="fc-nav">
        <button class="btn" data-act="card-prev" aria-label="前のカード">←</button>
        <span class="fc-count">${idx+1} / ${list.length}</span>
        <button class="btn" data-act="card-next" aria-label="次のカード">→</button>
      </div>
      <div class="fc-actions">
        <button class="btn btn-sm ${weak?"btn-vermilion":""}" data-act="card-mark">${weak?"苦手から外す":"苦手に登録"}</button>
        <button class="btn btn-sm btn-ghost" data-act="card-again">最初から</button>
      </div>
      <div class="small muted center mt16">${weakN? `苦手登録 ${weakN}枚。受験前日に「苦手のみ」で見直すのがおすすめです。`:"気になる用語は「苦手に登録」しておくと、直前にまとめて見返せます。"}</div>
    </div>`
    : `<div class="empty mt16"><span class="em-ico">🗂️</span>条件に合うカードがありません</div>`}
  `, after(){}};
};

act("card-field", el=>{ cardState.field=el.dataset.field; cardState.idx=0; cardState.flipped=false; cardState.order=null; cardState.weakOnly=false; render(); });
act("card-flip", ()=>{ cardState.flipped=!cardState.flipped; render(); });
act("card-next", ()=>{ const l=cardList(); cardState.idx=(cardState.idx+1)%Math.max(1,l.length); cardState.flipped=false; render(); });
act("card-prev", ()=>{ const l=cardList(); cardState.idx=(cardState.idx-1+Math.max(1,l.length))%Math.max(1,l.length); cardState.flipped=false; render(); });
act("card-mark", ()=>{
  const l=cardList(); const c=l[cardState.idx]; if(!c) return;
  if(ST.cardWeak[c.id]) delete ST.cardWeak[c.id];
  else ST.cardWeak[c.id]=1;
  save(true); render();
});
act("card-weak-only", ()=>{ cardState.weakOnly=!cardState.weakOnly; cardState.idx=0; cardState.flipped=false; cardState.order=null; render(); });
act("card-shuffle", ()=>{
  const l=cardList(); cardState.order=shuffle(l.map(t=>t.id)); cardState.idx=0; cardState.flipped=false; render(); toast("シャッフルしました");
});
act("card-again", ()=>{ cardState.idx=0; cardState.flipped=false; render(); });

let qFilter = {field:"all", q:"", tab:"all"};

        <div class="stat"><span class="lbl">セッション</span><span class="val">${(ST.history||[]).length}<small>件</small></span></div>
        <div class="stat"><span class="lbl">自作問題</span><span class="val">${custom.length}<small>問</small></span></div>
        <div class="stat"><span class="lbl">ロードマップ</span><span class="val">${Object.keys(ST.roadmap||{}).filter(k=>ST.roadmap[k]).length}<small>日</small></span></div>
      </div>
    </section>

    <section class="card">
      <div class="card-title">問題データの初期化</div>
      <div class="flex">
        <button class="btn btn-sm" data-act="reset-edits">組み込み問題の編集を元に戻す</button>

      </div>
      <hr class="hr-dash">

act("toggle-weekday", el=>{

document.addEventListener("input", e=>{

function questionForm(q){
  const isNew = !q;
  const d = q || {id:"", field:"strategy", mid:"", sub:"", q:"", c:["","","",""], a:0, e:"", pt:"", p:false, y:""};
  const midList = Array.from(new Set(allQuestions().filter(x=>x.mid).map(x=>x.mid)));
  return `<h3 id="modal-title">${isNew?"問題を追加":"問題を編集"}</h3>
    <div class="m-sub">${isNew?"自作の問題が演習・模擬試験に加わります。":"編集内容はこの端末にのみ保存されます。"}</div>
    <div class="inline-fields">
      <div class="field"><label>分野</label>
        <select class="inp" id="f-field">
          ${FIELD_KEYS.map(f=>`<option value="${f}"${d.field===f?" selected":""}>${FIELDS[f].name}</option>`).join("")}
        </select></div>
      <div class="field"><label>中分類（例：システム監査）</label>

      <div class="field"><label>小分類（例：システム監査）</label>
        <input class="inp" id="f-sub" value="${esc(d.sub||"")}" placeholder="分析に使う細かい科目名"></div>
    </div>
    <div class="field"><label>問題文</label>
      <textarea class="inp" id="f-q" rows="3" placeholder="〜として、最も適切なものはどれか。">${esc(d.q)}</textarea></div>
    <div class="field"><label>選択肢（正解を選んでください）</label>
      ${CHOICE_MARKS.map((m,i)=>`
        <div class="flex" style="margin-bottom:6px;gap:8px;flex-wrap:nowrap">
          <label class="chk-line" style="gap:5px"><input type="radio" name="f-ans" value="${i}" ${d.a===i?"checked":""}><span>${m}</span></label>
          <input class="inp" id="f-c${i}" value="${esc(d.c[i]||"")}" placeholder="選択肢${m}">
        </div>`).join("")}
    </div>
    <div class="field"><label>解説</label>
      <textarea class="inp" id="f-e" rows="3" placeholder="なぜその選択肢が正解なのか、他の選択肢が誤りである理由も書くと復習に効きます。">${esc(d.e||"")}</textarea></div>
    <div class="inline-fields">
      <div class="field"><label>暗記ポイント（任意）</label>
        <input class="inp" id="f-pt" value="${esc(d.pt||"")}" placeholder="例：損益分岐点＝固定費÷限界利益率"></div>
      <div class="field"><label>出題年度（任意）</label>
        <input class="inp" id="f-y" value="${esc(d.y||"")}" placeholder="2024"></div>
    </div>
    <label class="chk-line"><input type="checkbox" id="f-past" ${d.p?"checked":""}> 過去問をベースにした問題（一覧にラベルが付きます）</label>
    <div class="modal-foot">
      <button class="btn" data-act="close-modal">キャンセル</button>
      <button class="btn btn-primary" data-act="save-question" data-id="${d.id||""}">保存する</button>
    </div>`;
}
act("new-question", ()=>openModal(questionForm(null), {after(m){ m.querySelector("#f-q").focus(); }}));
act("edit-question", el=>{
  const q = allQuestions().find(x=>x.id===el.dataset.id) || qById(el.dataset.id);
  if(!q) return;
  openModal(questionForm(q), {after(m){ m.querySelector("#f-q").focus(); }});
});
act("save-question", el=>{
  const id = el.dataset.id;
  const field = $("#f-field").value;
  const mid = $("#f-mid").value.trim();
  const sub = $("#f-sub").value.trim();
  const qt = $("#f-q").value.trim();
  const cs = [0,1,2,3].map(i=>$("#f-c"+i).value.trim());
  const ansEl = document.querySelector('input[name="f-ans"]:checked');
  const a = ansEl? +ansEl.value : 0;
  const e = $("#f-e").value.trim();
  const pt = $("#f-pt").value.trim();
  const y = $("#f-y").value.trim();
  const p = $("#f-past").checked;
  if(!qt){ toast("問題文を入力してください"); return; }
  if(cs.some(c=>!c)){ toast("選択肢を4つすべて入力してください"); return; }
  if(!mid){ toast("中分類を入力してください（分析に使います）"); return; }
  if(id && String(id).startsWith("U")){
    const i = ST.custom.findIndex(x=>x.id===id);
    if(i>=0) ST.custom[i] = Object.assign({}, ST.custom[i], {field,mid,sub:sub||mid,q:qt,c:cs,a,e,pt,y:p?y:""});
  } else if(id){
    ST.edits[id] = {field,mid,sub:sub||mid,q:qt,c:cs,a,e,pt,p,y:p?y:undefined};
    // 元の問題に p フラグが無い場合に備える
    if(p) ST.edits[id].p = true;
  } else {
    const nq = {id:uid("U"), field, mid, sub:sub||mid, q:qt, c:cs, a, e, pt:pt||"", p:!!p, y:p?y:""};
    ST.custom = (ST.custom||[]).concat([nq]);
  }
  save(true); closeModal(); toast("保存しました"); render();
});
act("ask-hide-question", el=>{
  const id=el.dataset.id;
  openModal(`<h3 id="modal-title">この問題を非表示にしますか？</h3>
    <p class="m-sub">出題されなくなります。あとから元に戻せます。</p>
    <div class="modal-foot"><button class="btn" data-act="close-modal">やめる</button>
    <button class="btn btn-vermilion" data-act="hide-question" data-id="${id}">非表示にする</button></div>`);
});
act("hide-question", el=>{
  ST.hidden = (ST.hidden||[]).concat([el.dataset.id]);
  save(true); closeModal(); toast("非表示にしました"); render();
});
act("restore-hidden", ()=>{ ST.hidden=[]; save(true); toast("すべて元に戻しました"); render(); });
act("reset-edits", ()=>{ ST.edits={}; save(true); toast("組み込み問題を元に戻しました"); render(); });
act("ask-clear-custom", ()=>{
  openModal(`<h3 id="modal-title">自作問題をすべて削除しますか？</h3>
    <p class="m-sub">${(ST.custom||[]).length}問を削除します。この操作は取り消せません。</p>
    <div class="modal-foot"><button class="btn" data-act="close-modal">やめる</button>

act("clear-custom", ()=>{ ST.custom=[]; save(true); closeModal(); toast("自作問題を削除しました"); render(); });
act("ask-reset-all", ()=>{
  openModal(`<h3 id="modal-title">すべてのデータを削除しますか？</h3>
    <p class="m-sub">学習履歴・設定・自作問題・苦手登録がすべて消えます。元に戻せません。</p>

    <button class="btn btn-vermilion" data-act="reset-all">すべて削除</button></div>`);
});

  try{ localStorage.removeItem(KEY); }catch(e){}
  loadState(); save(true); closeModal(); toast("初期状態に戻しました"); navigate("home");
});

/* ---- エクスポート / インポート ---- */
act("export-data", ()=>{
  const data = JSON.stringify({app:"itp-notebook", exportedAt:new Date().toISOString(), state:ST}, null, 2);
  const blob = new Blob([data], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download=`itp-notebook-${dayKey(today())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
  toast("書き出しました");
});
act("import-data", ()=>{ const f=$("#import-file"); if(f) f.click(); });
document.addEventListener("change", e=>{
  if(e.target.id!=="import-file") return;
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    try{
      const obj = JSON.parse(rd.result);
      const st = obj.state || obj;
      if(!st || typeof st!=="object") throw new Error("形式が違います");
      ST = deepFill(DEFAULT_STATE, st);
      ST.session = null;
      save(true); render(); toast("読み込みました");
      navigate("home");
    }catch(err){ toast("読み込みに失敗しました"); }
    e.target.value="";
  };
  rd.readAsText(file);
});
act("open-settings", ()=>{ manageTab="settings"; navigate("manage"); });

/* =========================================================================
   起動処理 / グローバルイベント
   ========================================================================= */
let lastRenderAt = 0;
function render(){
  const name = ROUTES[currentRoute] ? currentRoute : "home";
  const v = VIEWS[name];
  paintChrome();
  const host = $("#view");
  if(!v){ host.innerHTML = `<div class="empty">ページが見つかりません</div>`; return; }
  const out = v(routeParam) || {html:""};
  host.innerHTML = out.html;
  if(typeof out.after === "function"){
    try{ out.after(); }catch(e){ console.warn(e); }
  }
  lastRenderAt = Date.now();
  // フォーカスを本文へ（スクリーンリーダー向け）
  if(name!=="quiz"){ host.focus({preventScroll:true}); }
}

/* キーボード操作（出題中） */
document.addEventListener("keydown", e=>{
  if(currentRoute!=="quiz") return;
  if(e.target.tagName==="INPUT" || e.target.tagName==="TEXTAREA" || e.target.tagName==="SELECT") return;
  const s = ST.session; if(!s) return;
  const q = qById(s.qids[s.idx]); if(!q) return;
  const ans = s.answers[s.idx];
  const locked = !!(ans && ans.locked);
  const key = e.key.toLowerCase();
  if(!locked && s.mode!=="exam"){
    const map = {a:0,b:1,c:2,d:3,"1":0,"2":1,"3":2,"4":3};
    if(key in map){ e.preventDefault(); applyChoice(map[key]); return; }
  }
  if(e.key==="Enter" || e.key==="ArrowRight"){
    if(locked){ e.preventDefault(); ACT["next-q"](); }
    else if(s.mode==="exam" && ans){ e.preventDefault(); ACT["next-q"](); }
  }
  if(e.key==="ArrowLeft" && s.idx>0){ e.preventDefault(); ACT["prev-q"](); }
});

/* 画面復帰時にカウントダウンや制限時間を再確認 */
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="visible" && currentRoute==="quiz" && ST.session && ST.session.mode==="exam"){
    updateTimer();
  }
});

/* ハッシュルーティング */
window.addEventListener("hashchange", onHashChange);
window.addEventListener("beforeunload", ()=>{ save(true); });

/* 初期化 */
(function boot(){
  loadState();
  if(!location.hash) location.replace("#/home");
  onHashChange();
  save(true);

  // 初回のみ軽い案内
  if(!ST.history.length && !sessionStorage.getItem("itp_welcomed")){
    sessionStorage.setItem("itp_welcomed","1");
    setTimeout(()=>{
      openModal(`<h3 id="modal-title">ようこそ、学習ノートへ</h3>
        <p class="m-sub">はじめに、受験日と学習ペースを確認しましょう。</p>
        <div class="note-box mb16">いまは <b>2026年11月12日</b> を受験予定日、<b>1日60分 × 週4日（火・木・土・日）</b> として計画を作っています。違う場合は設定から変更できます。</div>
        <ol class="small" style="padding-left:1.2em;line-height:2;margin:0">
          <li>まず「10問だけ演習」で現在地を確認</li>
          <li>結果画面で分野別・小分類別の弱点を見る</li>
          <li>ロードマップの今日のタスクをこなす</li>
          <li>誤答は「復習モード」で潰す</li>
        </ol>
        <div class="modal-foot">
          <button class="btn" data-act="close-modal">閉じる</button>
          <button class="btn btn-primary" data-act="welcome-start">10問はじめる</button>
        </div>`, {after(m){
          const b=m.querySelector('[data-act="welcome-start"]');
          if(b) b.addEventListener("click", ()=>{ closeModal(); startSession({mode:"practice",count:10}); });
        }});
    }, 450);
  }
})();

</script>
</body>
